<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vision • Hora certa</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.wrap{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vh 5vw}.brand{position:absolute;top:4vh;left:5vw;font-size:clamp(16px,2vw,30px);font-weight:800;opacity:.75}.time{font-size:clamp(70px,18vw,260px);font-weight:900;line-height:.9;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.date{margin-top:4vh;font-size:clamp(22px,4vw,60px);opacity:.82;text-transform:capitalize}.zone{position:absolute;bottom:4vh;font-size:clamp(12px,1.5vw,22px);opacity:.55}</style></head><body><main class="wrap"><div class="brand">VISION • Hora certa</div><div id="time" class="time">--:--</div><div id="date" class="date"></div><div class="zone">Horário de Brasília</div></main><script>const time=document.getElementById('time'),date=document.getElementById('date');function tick(){const now=new Date();time.textContent=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',hour12:false}).format(now);date.textContent=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(now)}tick();setInterval(tick,1000);</script></body></html>
