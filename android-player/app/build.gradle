plugins {
    id 'com.android.application'
}

android {
    namespace 'com.visionmidia.player'
    compileSdk 35

    defaultConfig {
        applicationId 'com.visionmidia.player'
        minSdk 24
        targetSdk 35
        versionCode 32
        versionName '1.5.20' // launcher branding preview; playback logic unchanged
        manifestPlaceholders = [playerLabel: 'Vision Player', setupScheme: 'visionmidia']
    }

    buildTypes {
        debug {
            // Device-only diagnostic APK: independent of any already installed Vision Player.
            // Restrict this to the isolated Aquario branch; no production package is changed.
            applicationIdSuffix '.aquario'
            versionNameSuffix '-aquario-diagnostic'
            manifestPlaceholders = [playerLabel: 'Vision Player Aquario Teste', setupScheme: 'visionmidia-aquario']
        }
        release {
            applicationIdSuffix '.stable'
            versionNameSuffix '-stable'
            manifestPlaceholders = [playerLabel: 'Vision Player Estável', setupScheme: 'visionmidia-stable']
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
