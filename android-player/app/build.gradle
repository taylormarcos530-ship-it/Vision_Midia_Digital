plugins {
    id 'com.android.application'
}

android {
    namespace 'com.visionmidia.player'
    compileSdk 35

    defaultConfig {
        applicationId 'com.visionmidia.player'
        minSdk 24
        targetSdk 35
        versionCode 24
        versionName '1.5.12'
        manifestPlaceholders = [playerLabel: 'Vision Player', setupScheme: 'visionmidia', bootReceiverEnabled: 'true']
    }

    buildTypes {
        debug {
            versionNameSuffix '-preview'
        }
        // Separate Android package: cannot overwrite the production Player.
        // Must be launched manually on a dedicated QA TV Box.
        homolog {
            initWith debug
            applicationIdSuffix '.homolog'
            versionNameSuffix '-homologacao'
            manifestPlaceholders = [playerLabel: 'Vision TESTE (nao oficial)', setupScheme: 'visionmidia-homolog', bootReceiverEnabled: 'false']
            matchingFallbacks = ['debug']
        }
        release {
            applicationIdSuffix '.stable'
            versionNameSuffix '-stable'
            manifestPlaceholders = [playerLabel: 'Vision Player Estável', setupScheme: 'visionmidia-stable']
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
