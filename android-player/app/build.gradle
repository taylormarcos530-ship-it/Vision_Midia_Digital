import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

// Firebase's Android app ID and API key are public client identifiers, not a
// Firebase service-account credential. Embed them only in the isolated QA APK.
// The production package stays unconfigured until separately registered.
def qaFirebaseFile = file('firebase-homolog-public.json')
def qaFirebase = qaFirebaseFile.exists() ? new JsonSlurper().parseText(qaFirebaseFile.getText('UTF-8')) : null
if (qaFirebase != null && (
        qaFirebase.package_name != 'com.visionmidia.player.homolog' ||
        qaFirebase.project_id != 'vision-midia-digital' ||
        !qaFirebase.api_key || !qaFirebase.mobilesdk_app_id || !qaFirebase.project_number)) {
    throw new GradleException('Invalid Firebase homolog config; refusing mismatched Android app')
}

// QA signing keys are owned by the operator and are NEVER committed to GitHub.
// A normal CI build still compiles a throwaway debug-signed QA package, but
// that package is NOT an update for any previously installed QA version.
def qaSigningPath = System.getenv('VISION_QA_KEYSTORE_FILE')
def qaSigningStorePass = System.getenv('VISION_QA_KEYSTORE_PASSWORD')
def qaSigningAlias = System.getenv('VISION_QA_KEY_ALIAS')
def qaSigningKeyPass = System.getenv('VISION_QA_KEY_PASSWORD')
def qaStableSigningReady = [qaSigningPath, qaSigningStorePass, qaSigningAlias, qaSigningKeyPass]
    .every { it != null && !it.isBlank() }


android {
    namespace 'com.visionmidia.player'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.visionmidia.player'
        minSdk 24
        targetSdk 35
        versionCode 36
        versionName '1.5.24'
        manifestPlaceholders = [playerLabel: 'Vision Player', setupScheme: 'visionmidia', bootReceiverEnabled: 'true']
        // Public Firebase app identifiers are supplied at build time. No service-account key in APK.
        buildConfigField 'String', 'VISION_FCM_APP_ID', JsonOutput.toJson(System.getenv('VISION_FCM_APP_ID') ?: '')
        buildConfigField 'String', 'VISION_FCM_API_KEY', JsonOutput.toJson(System.getenv('VISION_FCM_API_KEY') ?: '')
        buildConfigField 'String', 'VISION_FCM_PROJECT_ID', JsonOutput.toJson(System.getenv('VISION_FCM_PROJECT_ID') ?: '')
        buildConfigField 'String', 'VISION_FCM_SENDER_ID', JsonOutput.toJson(System.getenv('VISION_FCM_SENDER_ID') ?: '')
    }

    signingConfigs {
        if (qaStableSigningReady) {
            qaStable {
                storeFile file(qaSigningPath)
                storePassword qaSigningStorePass
                keyAlias qaSigningAlias
                keyPassword qaSigningKeyPass
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-preview'
        }
        // Separate Android package: cannot overwrite the production Player.
        // Must be launched manually on a dedicated QA TV Box.
        homolog {
            initWith debug
            applicationIdSuffix '.homolog'
            versionNameSuffix '-homologacao'
            manifestPlaceholders = [playerLabel: 'Vision TESTE (nao oficial)', setupScheme: 'visionmidia-homolog', bootReceiverEnabled: 'true']
            matchingFallbacks = ['debug']
            if (qaFirebase != null) {
                buildConfigField 'String', 'VISION_FCM_APP_ID', JsonOutput.toJson(qaFirebase.mobilesdk_app_id)
                buildConfigField 'String', 'VISION_FCM_API_KEY', JsonOutput.toJson(qaFirebase.api_key)
                buildConfigField 'String', 'VISION_FCM_PROJECT_ID', JsonOutput.toJson(qaFirebase.project_id)
                buildConfigField 'String', 'VISION_FCM_SENDER_ID', JsonOutput.toJson(qaFirebase.project_number)
            }
            // Only operator-provided stable credentials enable reproducible
            // signing. Without them, this is a non-distributable smoke build.
            if (qaStableSigningReady) {
                signingConfig signingConfigs.qaStable
            }
        }
        // An UNSIGNED artifact is built only for offline signing on the owner's
        // Android device. It preserves the same com.visionmidia.player.homolog
        // identifier and QA-only safety controls, but never ships a CI debug key.
        homologUnsigned {
            initWith homolog
            signingConfig = null
        }
        release {
            applicationIdSuffix '.stable'
            versionNameSuffix '-stable'
            manifestPlaceholders = [playerLabel: 'Vision Player Estável', setupScheme: 'visionmidia-stable']
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
    implementation 'com.google.android.gms:play-services-base:18.6.0'
}
