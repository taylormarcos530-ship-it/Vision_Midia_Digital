<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vision Conteúdo Dinâmico</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:Inter,Arial,sans-serif}
body{background:radial-gradient(circle at 20% 10%,#173c70 0,#07111f 45%,#02060c 100%)}main{height:100%;display:grid;place-items:center;padding:5vmin}
.card{width:min(92vw,1400px);height:min(86vh,850px);border:1px solid #ffffff22;border-radius:4vmin;background:#07111fd9;box-shadow:0 3vmin 10vmin #0008;padding:6vmin;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:clamp(12px,2vw,26px);letter-spacing:.18em;color:#8eb5ff;font-weight:800;text-transform:uppercase}.big{font-size:clamp(58px,14vw,190px);line-height:.95;font-weight:900;margin:.08em 0}.title{font-size:clamp(34px,7vw,100px);line-height:1.02;margin:.12em 0;font-weight:900}.sub{font-size:clamp(18px,3vw,42px);color:#b8c9df}.weather-row{display:flex;gap:5vmin;align-items:center}.weather-icon{font-size:clamp(80px,15vw,200px)}.forecast{display:grid;grid-template-columns:repeat(4,1fr);gap:2vmin;margin-top:4vmin}.forecast div{padding:2vmin;border-radius:2vmin;background:#ffffff0d}.forecast strong,.forecast span{display:block;font-size:clamp(16px,2.4vw,34px)}.news{display:grid;gap:2vmin;margin-top:3vmin}.news article{padding:2vmin 0;border-top:1px solid #ffffff20}.news strong{font-size:clamp(22px,3.2vw,46px);line-height:1.15}.status{font-size:clamp(16px,2vw,28px);color:#9fb0c7;margin-top:2vmin}
</style></head><body><main><section class="card" id="card"><div class="eyebrow" id="eyebrow">VISION MÍDIA DIGITAL</div><div id="content"></div></section></main>
<script>
const q=new URLSearchParams(location.search),type=q.get('type')||'clock',city=q.get('city')||'Anápolis',category=q.get('category')||'geral';
const content=document.getElementById('content'),eyebrow=document.getElementById('eyebrow');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const weatherCode=c=>c===0?'☀️':c<=3?'⛅':c<=48?'🌫️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌦️':c<=99?'⛈️':'🌤️';
function clock(){const d=new Date();eyebrow.textContent='AGORA';content.innerHTML='<div class="big">'+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</div><div class="title">'+d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})+'</div><div class="sub">'+esc(city)+'</div>'}
async function weather(){eyebrow.textContent='CLIMA • '+city;content.innerHTML='<div class="status">Atualizando previsão…</div>';try{const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=pt&format=json&name='+encodeURIComponent(city)).then(r=>r.json());const p=g.results?.[0];if(!p)throw Error('Cidade não encontrada');const w=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+p.latitude+'&longitude='+p.longitude+'&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=4').then(r=>r.json());content.innerHTML='<div class="weather-row"><div class="weather-icon">'+weatherCode(w.current.weather_code)+'</div><div><div class="big">'+Math.round(w.current.temperature_2m)+'°</div><div class="sub">Sensação '+Math.round(w.current.apparent_temperature)+'°C</div></div></div><div class="forecast">'+w.daily.time.map((d,i)=>'<div><strong>'+new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short'})+' '+weatherCode(w.daily.weather_code[i])+'</strong><span>'+Math.round(w.daily.temperature_2m_min[i])+'° / '+Math.round(w.daily.temperature_2m_max[i])+'°</span></div>').join('')+'</div>'}catch(e){content.innerHTML='<div class="title">Clima temporariamente indisponível</div><div class="sub">'+esc(city)+'</div>'}}
async function news(){eyebrow.textContent='NOTÍCIAS • '+category;content.innerHTML='<div class="status">Atualizando notícias…</div>';const topic=category==='esportes'?'esportes':category==='tecnologia'?'tecnologia':category==='negocios'?'negócios':'Brasil';const rss='https://news.google.com/rss/search?q='+encodeURIComponent(topic)+'&hl=pt-BR&gl=BR&ceid=BR:pt-419';try{const data=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(rss),{cache:'no-store'}).then(r=>r.json());if(!Array.isArray(data.items)||!data.items.length)throw Error('Sem notícias');content.innerHTML='<div class="news">'+data.items.slice(0,4).map(x=>'<article><strong>'+esc(x.title.replace(/\s+-\s+[^-]+$/,''))+'</strong></article>').join('')+'</div>'}catch(e){content.innerHTML='<div class="title">Notícias temporariamente indisponíveis</div><div class="sub">A programação continua normalmente.</div>'}}
if(type==='weather'){weather();setInterval(weather,10*60*1000)}else if(type==='news'){news();setInterval(news,10*60*1000)}else{clock();setInterval(clock,1000)}
</script></body></html>
