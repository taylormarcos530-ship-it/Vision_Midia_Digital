[build]
  command = "rm -rf dist && mkdir -p dist && cp 404.html app.js clock.html config.js downloads.css downloads.html downloads.js icon.svg index.html manifest.webmanifest master-embed.js master-payment.js master.css master.html master.js news-feed.html payment-ui.js player.css player.html player.js player.webmanifest saas-shell.js styles.css sw.js dist/ && cp -R downloads dist/downloads"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/master.html"
  [headers.values]
    Cache-Control = "no-store"
