plugins {
    id 'com.android.application'
}

android {
    namespace 'com.visionmidia.diagnosticlab'
    compileSdk 35

    defaultConfig {
        applicationId 'com.visionmidia.diagnosticlab.v05'
        minSdk 21
        targetSdk 32
        versionCode 5
        versionName '0.5-laboratorio'
    }

    buildTypes {
        debug { applicationIdSuffix '' }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies. Does not contain the customer's player.
