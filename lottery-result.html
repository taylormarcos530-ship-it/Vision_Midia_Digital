<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Resultado Mega-Sena</title><body><h1>Resultado da Mega-Sena</h1><p id="status">Carregando último resultado...</p><div id="result"></div><script>async function load(){try{const r=await fetch('./api/megasena',{cache:'default'});if(!r.ok)throw Error('Fonte indisponível');const d=await r.json();document.getElementById('result').textContent='Concurso '+d.numero+' — '+d.dataApuracao+' — '+(d.listaDezenas||[]).join(' • ');try{localStorage.setItem('vision-megasena-last',JSON.stringify(d))}catch{}document.getElementById('status').textContent='Último resultado publicado';}catch(e){try{const d=JSON.parse(localStorage.getItem('vision-megasena-last')||'null');if(!d||!Array.isArray(d.listaDezenas)||d.listaDezenas.length!==6)throw Error('sem cache');document.getElementById('result').textContent='Concurso '+d.numero+' — '+d.dataApuracao+' — '+d.listaDezenas.join(' • ');document.getElementById('status').textContent='Último resultado salvo • Sem atualização disponível'}catch{document.getElementById('status').textContent='Resultado temporariamente indisponível'}}}load();setInterval(load,10800000);</script></body></html>
