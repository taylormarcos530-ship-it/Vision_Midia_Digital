<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vision | Resultado Mega-Sena</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(125deg,#061426,#17375e);color:white;text-align:center;font-family:Arial,sans-serif}main{padding:4vw;width:100%}header{color:#ffd33d;font-size:clamp(18px,2vw,30px);font-weight:bold;letter-spacing:.12em}h1{font-size:clamp(38px,5vw,85px);margin:.5em 0}.meta{font-size:clamp(23px,3vw,48px)}.numbers{display:flex;flex-wrap:wrap;justify-content:center;gap:1.3vw;margin:4vw auto}.numbers b{display:grid;place-items:center;border-radius:50%;background:#ffd33d;color:#092039;width:clamp(65px,10vw,140px);aspect-ratio:1;font-size:clamp(28px,4vw,60px)}footer{font-size:clamp(14px,1.6vw,25px);opacity:.8}</style></head><body><main><header>VISION MÍDIA DIGITAL</header><h1>Resultado da Mega-Sena</h1><p class="meta" id="meta">Consultando último concurso...</p><section class="numbers" id="numbers"></section><footer id="status">Fonte: Loterias CAIXA</footer></main><script>const key='vision-megasena-last',interval=10800000;const fetchKey='vision-megasena-fetch-at';function show(d,old){if(!d||!Array.isArray(d.listaDezenas)||d.listaDezenas.length!==6)throw Error('Dados inválidos');document.querySelector('#meta').textContent='Concurso '+d.numero+' • '+d.dataApuracao;const root=document.querySelector('#numbers');root.replaceChildren(...d.listaDezenas.map(n=>{const b=document.createElement('b');b.textContent=String(n).padStart(2,'0');return b}));document.querySelector('#status').textContent=old?'Último resultado salvo • Aguardando atualização':'Fonte: Loterias CAIXA • Último resultado publicado'}async function load(){const now=Date.now();let last=0;try{last=Number(localStorage.getItem(fetchKey)||0)}catch{}if(last&&now-last<interval){try{show(JSON.parse(localStorage.getItem(key)||'null'),true);return}catch{}}const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),10000);try{const r=await fetch('./api/megasena',{signal:controller.signal});if(!r.ok)throw Error('Fonte indisponível');const d=await r.json();show(d,false);try{localStorage.setItem(key,JSON.stringify(d));localStorage.setItem(fetchKey,String(Date.now()))}catch{}}catch{try{show(JSON.parse(localStorage.getItem(key)||'null'),true)}catch{document.querySelector('#meta').textContent='Resultado indisponível • Verifique a conexão'}}finally{clearTimeout(timeout)}}try{show(JSON.parse(localStorage.getItem(key)||'null'),true)}catch{}load();setInterval(load,interval);</script></body></html>
