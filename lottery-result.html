<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Resultado Mega-Sena</title><body><h1>Resultado da Mega-Sena</h1><p id="status">Carregando último resultado...</p><div id="result"></div><script>async function load(){try{const r=await fetch('https://servicebus2.caixa.gov.br/portaldeloterias/api/megasena',{cache:'no-store'});if(!r.ok)throw Error('Fonte indisponível');const d=await r.json();document.getElementById('result').textContent='Concurso '+d.numero+' — '+d.dataApuracao+' — '+(d.listaDezenas||[]).join(' • ');document.getElementById('status').textContent='Último resultado publicado';}catch(e){document.getElementById('status').textContent='Resultado temporariamente indisponível';}}load();setInterval(load,10800000);</script></body></html>
