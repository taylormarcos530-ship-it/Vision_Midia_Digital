name: Vision V2 Three PG17 Majority JTI Leader Fencing Restore No Deploy
on:
  push:
    branches:
      - experiment/vision-v2-toctou-continuous-guard-qa-20261102
    paths:
      - 'tests/vision-v2-sequence-qa/quorum-jti-qa/controller.py'
      - 'tests/vision-v2-sequence-qa/quorum-jti-qa/worker.py'
      - '.github/workflows/vision-v2-three-pg17-jti-voter-quorum-rollback-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  witness-adversarial:
    name: 4 PG17 containers 2 OS auth workers 1 canonical anchor and Redis7 x2
    runs-on: ubuntu-latest
    timeout-minutes: 24
    services:
      postgres_main:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      postgres_witness:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_witness_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-witness-password
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_witness_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      postgres_shadow:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_witness_shadow_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-shadow-password
        ports: [5435:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_witness_shadow_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      postgres_anchor:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_anchor_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-anchor-password
        ports: [5436:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_anchor_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis_primary:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis_secondary:
        image: redis:7.4-alpine
        ports: [6380:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse official credentials and foreign branches
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-toctou-continuous-guard-qa-20261102
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          test -z "${PGSERVICE:-}"
          test -z "${REDIS_URL:-}"
          echo 'NO_DEPLOY=1 QA_STREAM_GUARD_GROUP=1 DRAIN_DISABLED=1'
      - run: python -m pip install 'psycopg[binary,pool]==3.2.6' 'redis==5.2.1' 'websockets==14.2'
      - name: Ephemeral localhost TLS only
        run: |
          set -euo pipefail
          mkdir -p qa-restore-certs
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout qa-restore-certs/local.key -out qa-restore-certs/local.pem \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          chmod 600 qa-restore-certs/local.key
      - name: Syntax and separate PG17/Redis service checks
        run: |
          python -m py_compile tests/vision-v2-sequence-qa/quorum-jti-qa/controller.py
          python -m py_compile tests/vision-v2-sequence-qa/quorum-jti-qa/worker.py
      - name: Three real PG17 durable voters, concurrent OS processes and real 1/2 majority rollback
        env:
          QA_STREAM_GUARD_GROUP: '1'
          QA_VOTER_WITNESS_CONTAINER: ${{ job.services.postgres_witness.id }}
          QA_VOTER_SHADOW_CONTAINER: ${{ job.services.postgres_shadow.id }}
          QA_VOTER_ANCHOR_CONTAINER: ${{ job.services.postgres_anchor.id }}
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/quorum-jti-qa/controller.py | tee qa-v2-three-voter-quorum.log
      - name: Check quorum PASS vs durable majority restore SECURITY FAIL and fail-closed
        run: |
          python - <<'PY'
          import json
          x=json.load(open('qa-v2-three-voter-quorum.json'))
          assert x['production_GO'] is False
          assert x['actual_PostgreSQL17_voters']==3
          assert x['quorum_size']==2
          assert x['two_process_same_JTI']['status']=='PASS_LOCAL_AT_MOST_ONE_QUORUM_ACK'
          assert x['voter_failures']['one_down']['result']['status']=='ACK'
          assert x['voter_failures']['two_down']['result']['status']=='DENY'
          assert not x['single_voter_pg_restore']['token_reaccepted']
          assert x['two_voter_pg_restore']['old_signed_JTI_reaccepted']
          assert x['manual_term_fencing']['stale_leader_rejected']
          assert x['15_token_login_trial']['ACKs']==15
          assert x['security_verdict']=='FAIL_NO_GO_2OF3_RESTORE_REPLAY_SPLIT_BRAIN_AND_NO_CONSENSUS'
          print('LOCAL_QUORUM_PASS=true MAJORITY_ROLLBACK_SECURITY_FAIL=true NO_GO=1')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg17-three-voter-jti-majority-rollback-security-fail
          path: |
            qa-v2-three-voter-quorum.log
            qa-v2-three-voter-quorum.json
          retention-days: 14
