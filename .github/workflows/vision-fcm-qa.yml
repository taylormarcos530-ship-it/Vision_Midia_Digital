name: Vision FCM QA - Android push and offline player
on:
  push:
    branches:
      - feature/vision-fcm-player-qa-20261028
  pull_request:
    branches:
      - release/vision-player-stable-1521-rc-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax and FCM regression
        run: |
          set -euo pipefail
          node --check player.js
          node --test tests/qa-server-request-cost.test.cjs tests/qa-v28-traffic-and-rotation.test.cjs tests/qa-fcm-delivery.test.cjs

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VISION_FCM_APP_ID: ${{ secrets.VISION_FCM_APP_ID }}
      VISION_FCM_API_KEY: ${{ secrets.VISION_FCM_API_KEY }}
      VISION_FCM_PROJECT_ID: ${{ secrets.VISION_FCM_PROJECT_ID }}
      VISION_FCM_SENDER_ID: ${{ secrets.VISION_FCM_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Embed local player assets
        run: |
          set -euo pipefail
          mkdir -p android-player/app/src/main/assets
          cp player.html player.css player.js config.js icon.svg player.webmanifest sw.js clock.html news-feed.html news-feed.css news-feed.js android-player/app/src/main/assets/
      - name: Compile unconfigured QA APK for SDK/syntax validation
        run: gradle -p android-player --no-daemon assembleHomologUnsigned
      - name: Inspect package, version, and Firebase readiness
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android-player/app/build/outputs/apk -type f -name '*.apk' -path '*homologUnsigned*' | head -n 1)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/vision-fcm-badging.txt
          grep -q "name='com.visionmidia.player.homolog'" /tmp/vision-fcm-badging.txt
          grep -q "versionCode='34'" /tmp/vision-fcm-badging.txt
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"; then
            echo "Unexpected pre-signed package"; exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/Vision-FCM-QA-V34-sem-assinatura.apk
          sha256sum dist/Vision-FCM-QA-V34-sem-assinatura.apk > dist/Vision-FCM-QA-V34.sha256
          if [ -n "$VISION_FCM_APP_ID" ] && [ -n "$VISION_FCM_API_KEY" ] && [ -n "$VISION_FCM_PROJECT_ID" ] && [ -n "$VISION_FCM_SENDER_ID" ]; then
            echo "FCM app configuration: provisioned" > dist/readiness.txt
          else
            echo "FCM app configuration: MISSING - APK builds but push is disabled until configured and rebuilt." > dist/readiness.txt
          fi
          {
            echo "branch=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "package=com.visionmidia.player.homolog"
            echo "versionCode=34"
            echo "signed=false"
            echo "server_relay_deployed=false"
            echo "DO NOT install on production TVs; do not assume FCM works until provisioned."
          } > dist/provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Vision-FCM-QA-v34-UNSIGNED-NOT-FOR-PRODUCTION
          path: dist/
          if-no-files-found: error
          retention-days: 30
