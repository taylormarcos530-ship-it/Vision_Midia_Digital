name: Vision V2 Encrypted Audit + Local Quarantine QA - NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/audit-export-qa/**'
      - 'tests/vision-v2-sequence-qa/quarantine-qa/**'
      - '.github/workflows/vision-v2-audit-quarantine-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-quarantine-qa:
    name: Encrypted audit + disposable PostgreSQL HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      VISION_V2_QA_POSTGRES_DSN: postgresql://postgres:qa-only-local-password@127.0.0.1:5432/vision_v2_quarantine_disposable
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout read only, no persisted credential
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject any production context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031"
          echo 'QA_ONLY=true NO_SUPABASE=true NO_DEPLOY=true NO_APK=true NO_TVS=true'
          test -f tests/vision-v2-sequence-qa/audit-export-qa/audit_backup.py
          test -f tests/vision-v2-sequence-qa/quarantine-qa/schema.sql
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned QA crypto + PostgreSQL driver
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography==44.0.3' 'psycopg[binary]==3.2.6'
      - name: AES-256-GCM export integrity, restore and failure injection
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/vision-v2-sequence-qa/audit-export-qa -p 'test_*.py' -v
          echo 'AUDIT_AES256_GCM_EXPORT_RESTORE=PASS'
      - name: Apply schema only in disposable local PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,psycopg
          from pathlib import Path
          schema=Path('tests/vision-v2-sequence-qa/quarantine-qa/schema.sql').read_text()
          with psycopg.connect(os.environ['VISION_V2_QA_POSTGRES_DSN']) as con:
              name=con.execute('SELECT current_database()').fetchone()[0]
              assert name=='vision_v2_quarantine_disposable'
              con.execute(schema)
              print('LOCAL_POSTGRES_SCHEMA_PASS='+name)
          PY
      - name: Loopback HTTP, PostgreSQL ACK atomicity and tenant separation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/vision-v2-sequence-qa/quarantine-qa -p 'test_*.py' -v
          echo 'HTTP_POSTGRES_QUARANTINE=PASS'
      - name: Explicitly no release artifact
        shell: bash
        run: |
          echo 'NO_DEPLOY=true NO_SECRETS=true NO_PRODUCTION_TRAFFIC=true'
