name: Vision V2 PG17 Multiprocess Admission Epoch Socket Midstream Revoke NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/secure-pool-qa/multiprocess_socket_fence_qa.py'
      - '.github/workflows/vision-v2-multiprocess-socket-epoch-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    name: PG17 ${{ matrix.clients }} clients pool ${{ matrix.pool }} chunk ${{ matrix.chunk }} no-old-epoch FIN RST half-open revoke
    strategy:
      fail-fast: false
      matrix:
        clients: [100,300]
        pool: [8,12,20]
        chunk: [65536,262144]
    runs-on: ubuntu-latest
    timeout-minutes: 19
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stop on any production secret or branch mismatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6'
      - name: Local independent OS endpoint processes with PG17 FORCE RLS, RST and gated socket revocation
        env:
          QA_N: ${{ matrix.clients }}
          QA_POOL_SIZE: ${{ matrix.pool }}
          QA_CHUNK: ${{ matrix.chunk }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/vision-v2-sequence-qa/secure-pool-qa/multiprocess_socket_fence_qa.py
          python -u tests/vision-v2-sequence-qa/secure-pool-qa/multiprocess_socket_fence_qa.py
          echo "QA_MULTIPROCESS_SOCKET_PASS=true"
