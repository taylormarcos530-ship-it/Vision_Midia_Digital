name: Vision V2 Encrypted Economic Archive PG17 Original Report NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/economy-guardrails/encrypted-archive-qa.py'
      - '.github/workflows/vision-v2-encrypted-archive-economy-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    name: Immutable AES-GCM SIGKILL ${{ matrix.tvs }} TVs ${{ matrix.entropy }} entropy
    strategy:
      fail-fast: false
      matrix:
        tvs: [10, 100, 300]
        entropy: [low, high]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse production credentials and other branches
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          test -z "${PGSERVICE:-}"
          echo 'NO_DEPLOY=true QA_STREAM_GUARD_GROUP=1 DRAIN_DISABLED=true'
      - run: python -m pip install 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: 1h real 15s data, 8/12/18/24h modeled, 3 SIGKILL, SQLite fail injections
        shell: bash
        env:
          QA_STREAM_GUARD_GROUP: '1'
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/economy-guardrails/encrypted-archive-qa.py --tvs ${{ matrix.tvs }} --entropy ${{ matrix.entropy }} | tee qa-economy-archive-${{ matrix.tvs }}-${{ matrix.entropy }}.log
      - name: Preserve logs even FAIL
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-economy-archive-${{ matrix.tvs }}-${{ matrix.entropy }}
          path: qa-economy-archive-${{ matrix.tvs }}-${{ matrix.entropy }}.log
          if-no-files-found: warn
          retention-days: 14

  original-commercial:
    name: UNMODIFIED 300-client commercial report JWT RLS restart parity PG17
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse production credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
      - run: python -m pip install 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Unmodified original commercial tests (not new archive full RPC)
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/commercial-parity-qa/qa.py | tee qa-original-commercial-parity.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-original-commercial-parity
          path: qa-original-commercial-parity.log
          retention-days: 14
