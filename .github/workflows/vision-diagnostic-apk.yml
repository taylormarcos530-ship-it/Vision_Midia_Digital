name: Vision Diagnostic APK (isolated)

on:
  push:
    branches:
      - fix/advertiser-portal-safety-20261013
    paths:
      - android-diagnostic-lab/**
      - .github/workflows/vision-diagnostic-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-apk-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout lab branch without release credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify no client player or production file was altered
        shell: bash
        run: |
          set -euo pipefail
          BASE=87d907010db614d5459b6af9c7b421328e64f225
          git cat-file -e "${BASE}^{commit}"
          if ! git diff --quiet "$BASE" HEAD -- \
            player.js player.html player.css player.webmanifest \
            android-player/ config.js sw.js \
            index.html app.js master.html master.js \
            supabase/functions/device-gateway/index.ts \
            supabase/functions/device-control/ \
            supabase/functions/device-monitoring/ \
            supabase/functions/master-admin/index.ts \
            netlify.toml vercel.json; then
            echo "::error::Production files changed; do not build."
            exit 1
          fi
          grep -Fq "applicationId 'com.visionmidia.diagnosticlab.v02'" android-diagnostic-lab/app/build.gradle
          if grep -q 'uses-permission' android-diagnostic-lab/app/src/main/AndroidManifest.xml; then
            echo "::error::Diagnostic must never request privileged permissions."
            exit 1
          fi
          echo "Diagnostic app is isolated and privilege-free."
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner's preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Android SDK preinstalled by the runner; no sdkmanager installation required."
      - name: Use Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build only diagnostic debug APK
        working-directory: android-diagnostic-lab
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Check distinct APK identifier and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=android-diagnostic-lab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee android-diagnostic-lab/diagnostic-apk-sha256.txt
          echo "This is a sideload-only debug APK for a dedicated test device."
      - name: Store separate diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: vision-diagnostico-tvbox-teste
          path: |
            android-diagnostic-lab/app/build/outputs/apk/debug/app-debug.apk
            android-diagnostic-lab/diagnostic-apk-sha256.txt
          if-no-files-found: error
          retention-days: 7

# Never deploy to Netlify/Vercel/Play Store, modify customer app or publish Edge Functions.
