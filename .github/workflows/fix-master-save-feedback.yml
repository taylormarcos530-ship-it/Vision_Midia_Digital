name: Fix Master Save Feedback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-master-save-feedback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply targeted Master fixes
        shell: bash
        run: |
          set -euo pipefail
          echo '...


' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          node --check master.js
          grep -q "saveCompanyRequest" master.js
          grep -q "id=\"me-status\"" master.html
          grep -q "dialog-toast-root" master.css
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'taylormarcos530-ship-it'
          git config user.email 'taylormarcos530@gmail.com'
          git add master.js master.html master.css
          git commit -m 'fix: persist company plan and show save feedback'
          git push origin HEAD:main
