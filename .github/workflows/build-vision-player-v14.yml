name: Build Vision Player 1.4 APK

on:
  push:
    branches: [stage-signage-v2]
    paths:
      - '.github/workflows/build-vision-player-v14.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-signage-v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle current web player into APK
        run: |
          mkdir -p android-player/app/src/main/assets
          cp player.html player.css player.js config.js player.webmanifest icon.svg android-player/app/src/main/assets/
      - name: Validate web player JavaScript
        run: node --check player.js
      - name: Build debug APK
        run: gradle -p android-player :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp android-player/app/build/outputs/apk/debug/app-debug.apk Vision-Player-1.4.0-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vision-Player-1.4.0-APK
          path: Vision-Player-1.4.0-preview.apk
          if-no-files-found: error
          retention-days: 14
