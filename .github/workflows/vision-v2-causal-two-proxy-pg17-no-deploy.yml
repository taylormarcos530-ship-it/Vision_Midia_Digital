name: Vision V2 PG17 Two Proxy Causal 503 Classification NO DEPLOY
# Revalidate corrected causal harness HEAD with six isolated PG17 jobs.
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/causal-two-proxy-qa/**'
      - '.github/workflows/vision-v2-causal-two-proxy-pg17-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal:
    name: Two proxy PG17 300 pool ${{ matrix.pool }} chunk ${{ matrix.chunk }}
    strategy:
      fail-fast: false
      matrix:
        pool: [8,12,20]
        chunk: [65536,262144]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict QA-only local boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          test -z "${PGSERVICE:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Two HTTP proxies one PG17 state, 300 verified exports, classified faults, revoke
        env:
          QA_POOL: ${{ matrix.pool }}
          QA_CHUNK: ${{ matrix.chunk }}
          QA_STREAM_GUARD_GROUP: '1'
        run: |
          set -euo pipefail
          python -m py_compile tests/vision-v2-sequence-qa/causal-two-proxy-qa/causal.py
          python -u tests/vision-v2-sequence-qa/causal-two-proxy-qa/causal.py | tee qa-causal.log
      - name: Preserve every GET attempt and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-causal-p${{ matrix.pool }}-c${{ matrix.chunk }}
          path: |
            qa-causal.log
            qa-causal-ledger.json
          if-no-files-found: warn
          retention-days: 14
