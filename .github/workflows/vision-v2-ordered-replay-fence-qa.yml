name: Vision V2 PG17 Ordered Replay Commercial Invalidation Auth Fence NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/ordered-replay-fence-qa/**'
      - '.github/workflows/vision-v2-ordered-replay-fence-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordered-failclosed:
    name: Two independent durable consumers, hard-crash replay, RLS, PG socket failure and fencing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Branch and credentials safety guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          echo "PG17_DISPOSABLE_ONLY=true NO_PRODUCTION=true NO_DEPLOY=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Python static syntax check
        run: python -m py_compile tests/vision-v2-sequence-qa/ordered-replay-fence-qa/qa.py
      - name: Replay persisted globally ordered outbox, revoke and PG TCP fault in live HTTP stream
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/ordered-replay-fence-qa/qa.py
          echo "QA_ORDERED_FENCE_PASS=true"
      - name: Confirm no production touched
        if: always()
        run: echo "NO_SUPABASE=true NO_APK=true NO_PANEL=true NO_SITE=true NO_TV=true NO_REAL_HISTORY=true"
  rolling100-300:
    name: Separate PostgreSQL17 full 100-300 gzip cutover and post-rollback barrier
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Branch and credentials safety guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Full 100 and 300 HTTP current authoritative per-block SQL baseline
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/rolling-cutover-outbox-qa/qa.py
          echo "QA_ROLLING_POST_ROLLBACK_PASS=true"
      - name: No deploy
        if: always()
        run: echo "NO_PRODUCTION=true NO_DEPLOY=true"
  encrypted-outbox:
    name: Separate PG17 AES remote manifest forced crash and real cold HTTP regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Branch and credentials safety guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Assert remote AES-GCM manifest crash, outbox retry and cold full JSON 100 and 300
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/cold-remote-qa/qa.py
          echo "QA_ENCRYPTED_OUTBOX_PASS=true"
      - name: No deploy
        if: always()
        run: echo "NO_PRODUCTION=true NO_DEPLOY=true"
