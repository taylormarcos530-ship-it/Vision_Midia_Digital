name: Finalize TV Replacement
on:
  push:
    branches: [stage-signage-v2]
    paths:
      - '.github/finalize_replace_tv.py'
      - '.github/workflows/finalize-replace-tv.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-signage-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/finalize_replace_tv.py
      - run: |
          node --check app.js
          node --check master.js
          grep -q 'companyRole' app.js
          grep -q "\['owner','admin'\]" supabase/functions/replace-device/index.ts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js master.js supabase/functions/replace-device/index.ts
          git diff --cached --quiet || git commit -m 'fix: restrict TV replacement to administrators'
          git push
