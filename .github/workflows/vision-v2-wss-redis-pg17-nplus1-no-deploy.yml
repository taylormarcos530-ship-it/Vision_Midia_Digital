name: Vision V2 WSS TLS Redis PG17 Multi-Instance SIGKILL N+1 NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/wss-scale-qa/**'
      - '.github/workflows/vision-v2-wss-redis-pg17-nplus1-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wss-matrix:
    name: WSS TLS Redis PG17 ${{ matrix.tvs }} TVs N+1 SIGKILL
    strategy:
      fail-fast: false
      matrix:
        tvs: [100, 300, 600, 1000]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse official credentials and branch, preserve NO-GO
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          test -z "${REDIS_URL:-}"
          echo 'NO_DEPLOY=1 QA_STREAM_GUARD_GROUP=1 DRAIN_DISABLED=1'
      - name: Install pinned local QA network and PG libs
        run: python -m pip install 'psycopg[binary,pool]==3.2.6' 'redis==5.2.1' 'websockets==14.2'
      - name: Locally self-sign ephemeral TLS certificate, never commit key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-wss-certs
          chmod 700 qa-wss-certs
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout qa-wss-certs/qa-only.key -out qa-wss-certs/qa-only.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            >/dev/null 2>&1
          chmod 600 qa-wss-certs/qa-only.key
      - name: Real localhost WSS multi-process Redis TTL PostgreSQL17 and SIGKILL
        shell: bash
        env:
          QA_STREAM_GUARD_GROUP: '1'
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/wss-scale-qa/verify.py \
            --tvs ${{ matrix.tvs }} \
            --cert qa-wss-certs/qa-only.pem --key qa-wss-certs/qa-only.key \
            | tee qa-wss-${{ matrix.tvs }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-wss-${{ matrix.tvs }}-json-log
          path: qa-wss-${{ matrix.tvs }}.log
          retention-days: 14
          if-no-files-found: warn
