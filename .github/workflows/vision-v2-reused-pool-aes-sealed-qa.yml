          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exclusive experimental QA branch, no production keys
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          echo "DISPOSABLE_PG17=true NO_PRODUCTION=true NO_DEPLOY=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned fixture-only dependencies
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Verify fail closed old revision, improved 503 ratio and full SHA after replay
        env:
          QA_COMMERCIAL_ADMISSIONS: "12"
          QA_PG_POOL_SIZE: "12"
          QA_COMMERCIAL_CHUNK: "262144"
        run: |
          set -euo pipefail
          python -m py_compile tests/vision-v2-sequence-qa/secure-pool-qa/mixed_300.py
          python -u tests/vision-v2-sequence-qa/secure-pool-qa/mixed_300.py
          echo "QA_REUSED_POOL_300_PASS=true"
  durable-outbox:
