name: Vision V2 Commercial Parity RLS 300 Restart PG17 - NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/commercial-parity-qa/**'
      - '.github/workflows/vision-v2-commercial-parity-rls-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-parity:
    name: PG17 commercial COUNT DISTINCT snapshots + synthetic JWT RLS + 300 HTTP restart
    runs-on: ubuntu-latest
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - name: Read only branch checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce QA-only branch and no production credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031'
          echo 'QA_POSTGRES17_DISPOSABLE=true NO_SUPABASE=true NO_SQL_ON_PRODUCTION=true'
          echo 'NO_DEPLOY=true NO_APK=true NO_PANEL=true NO_SITE=true NO_TVS=true NO_DELETE=true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only disposable PostgreSQL client
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6'
      - name: Run actual SQL commercial parity, 300 HTTP concurrent clients and gateway restart
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/commercial-parity-qa/qa.py
          echo 'VISION_V2_COMMERCIAL_RLS_RESTART_QA=PASS'
      - name: Confirm nothing in production touched
        if: always()
        run: echo 'NO_SUPABASE=true NO_DEPLOY=true NO_APK=true NO_PRODUCTION_DB=true NO_DELETE_ORIGINALS=true'
