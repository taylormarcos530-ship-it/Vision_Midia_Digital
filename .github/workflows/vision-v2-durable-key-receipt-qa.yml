name: Vision V2 Durable AES Key ID Rotation PostgreSQL17 NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/secure-pool-qa/durable_keyring.py'
      - 'tests/vision-v2-sequence-qa/secure-pool-qa/durable_keyring_test.py'
      - '.github/workflows/vision-v2-durable-key-receipt-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crash-rotation:
    name: PG17 durable receipt prepared+committed AES generation crash at ${{ matrix.phase }}
    strategy:
      fail-fast: false
      matrix:
        phase: [rename_1, rename_2, manifest_before_SQL_commit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: QA-only branch and forbidden production env guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          echo "ONLY_POSTGRES17_127001=true NO_DEPLOY=true NO_PRODUCTION=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact QA dependencies
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Prove DB PREPARED receipt, crash, exact SHA rollforward, atomic pointer, HMAC and seal
        env:
          QA_CRASH_PHASE: ${{ matrix.phase }}
        run: |
          set -euo pipefail
          python -m py_compile tests/vision-v2-sequence-qa/secure-pool-qa/durable_keyring.py tests/vision-v2-sequence-qa/secure-pool-qa/durable_keyring_test.py
          python -u tests/vision-v2-sequence-qa/secure-pool-qa/durable_keyring_test.py
          echo "QA_DURABLE_KEY_RECEIPT_PASS=true"
