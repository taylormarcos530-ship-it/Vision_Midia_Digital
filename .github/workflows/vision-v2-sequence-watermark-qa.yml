name: Vision V2 Sequence + Offline Clock QA - NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/**'
      - '.github/workflows/vision-v2-sequence-watermark-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sequence-offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout no credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard branch and no deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031"
          echo "QA_ONLY=true NO_DEPLOY=true NO_SUPABASE=true NO_PRODUCTION_SECRETS=true"
      - name: Test sequence model and real temporary file persistence
        run: node --test tests/vision-v2-sequence-qa/*.test.cjs
