name: Vision TV presence + advertiser portal safety (isolated)
on:
  push:
    branches:
      - fix/device-status-heartbeat-alignment-isolated-20261027
      - integration/vision-traffic-monitoring-qa-20261027
    paths:
      - app.js
      - advertiser-portal.mjs
      - anunciante.html
      - supabase/functions/device-monitoring/index.ts
      - supabase/functions/master-admin/index.ts
      - docs/sql/vision-advertiser-presence-3min.REVIEW.sql
      - tools/test-device-status-heartbeat.mjs
      - .github/workflows/vision-device-status-monitoring-isolated.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitoring-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check advertiser-portal.mjs
      - name: Offline and advertiser-status regression
        run: node --test tools/test-device-status-heartbeat.mjs
      - name: Review-only SQL is never applied by CI
        run: |
          test -s docs/sql/vision-advertiser-presence-3min.REVIEW.sql
          grep -F 'REVIEW ONLY; DO NOT EXECUTE AUTOMATICALLY' docs/sql/vision-advertiser-presence-3min.REVIEW.sql
