name: Apply Plan Validation And Media Optimizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-plan-media-opt.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply targeted patch
        run: python tools/patch_plan_media_optimizer.py
      - name: Validate JavaScript
        run: |
          node --check master.js
          node --check app.js
      - name: Validate required fields and optimizer
        run: |
          grep -q 'master-plan-form.*novalidate' master.html
          grep -q 'mp-description.*required' master.html
          grep -q 'Preencha todos os campos obrigatórios' master.js
          grep -q 'optimizeImageForUpload' app.js
          grep -q "image/webp', 0.92" app.js
          git diff --check
      - name: Commit application changes
        run: |
          git config user.name 'taylormarcos530-ship-it'
          git config user.email 'taylormarcos530@gmail.com'
          git add master.html master.js app.js index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'fix: validate plans and optimize images as WebP'
            git push origin main
          fi
