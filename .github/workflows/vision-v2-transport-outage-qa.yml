name: Vision V2 Two-Process Transport + PG Outage AES QA NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/secure-pool-qa/two_hosts_fault_qa.py'
      - 'tests/vision-v2-sequence-qa/secure-pool-qa/key_pg_outage_qa.py'
      - '.github/workflows/vision-v2-transport-outage-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http-transport:
    name: Two isolated OS endpoints TCP loss, ${{ matrix.clients }} HTTP clients pool ${{ matrix.pool }} chunk ${{ matrix.chunk }}
    strategy:
      fail-fast: false
      matrix:
        clients: [100,300]
        pool: [8,12,20]
        chunk: [65536,262144]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Branch and production secrets guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          echo "PG17_SYNTHETIC=true NO_DEPLOY=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Two independent Linux OS workers, actual refused TCP and 100/300 full HTTP
        env:
          QA_COMMERCIAL_ADMISSIONS: ${{ matrix.pool }}
          QA_PG_POOL_SIZE: ${{ matrix.pool }}
          QA_COMMERCIAL_CHUNK: ${{ matrix.chunk }}
          QA_CLIENTS: ${{ matrix.clients }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/vision-v2-sequence-qa/secure-pool-qa/two_hosts_fault_qa.py
          python -u tests/vision-v2-sequence-qa/secure-pool-qa/two_hosts_fault_qa.py
          echo "QA_TWO_HOSTS_PASS=true"
  receipt-db-outage:
    name: Synthetic 0600 AES key across processes, local PG TCP refused after ${{ matrix.phase }}
    strategy:
      fail-fast: false
      matrix:
        phase: [rename_1,rename_2,manifest_before_SQL_commit]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: No official credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Persistent synthetic key and durable SQL receipt unavailable/resumed
        env:
          QA_PHASE: ${{ matrix.phase }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/vision-v2-sequence-qa/secure-pool-qa/key_pg_outage_qa.py
          python -u tests/vision-v2-sequence-qa/secure-pool-qa/key_pg_outage_qa.py
          echo "QA_AES_PG_OUTAGE_PASS=true"
