name: Vision outage resilience - isolated player CI
on:
  push:
    branches:
      - fix/vision-outage-resilience-isolated-20261026
    paths:
      - player.js
      - master.js
      - tests/vision-outage-resilience.test.cjs
      - tests/player-network-backoff.test.cjs
      - .github/workflows/vision-outage-resilience-isolated.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outage-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check player.js
          node --check master.js
      # player-controls.test.cjs currently fails against the production baseline\n      # (missing DOM document in its audio VM fixture); do not change audio or\n      # pretend it is a regression introduced by this branch.\n      - name: Offline resiliency tests
        run: node --test tests/player-network-backoff.test.cjs tests/vision-outage-resilience.test.cjs tests/offline-expiry.test.cjs tests/player-network.test.cjs
      - name: Prepare Android test build assets
        run: |
          mkdir -p android-player/app/src/main/assets
          cp player.html player.css player.js config.js icon.svg player.webmanifest sw.js clock.html news-feed.html news-feed.css news-feed.js android-player/app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android candidate - do not publish
        run: gradle -p android-player --no-daemon assembleDebug
      - name: Verify candidate exists (artifact stays inside CI)
        run: test -s android-player/app/build/outputs/apk/debug/app-debug.apk
