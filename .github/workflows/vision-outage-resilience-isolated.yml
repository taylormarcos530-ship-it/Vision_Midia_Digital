name: Vision outage resilience - isolated player CI
on:
  push:
    branches:
      - fix/vision-outage-resilience-isolated-20261026
    paths:
      - player.js
      - master.js
      - tests/vision-outage-resilience.test.cjs
      - tests/player-network-backoff.test.cjs
      - .github/workflows/vision-outage-resilience-isolated.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outage-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check player.js
          node --check master.js
      - name: Offline resiliency tests
        run: node --test tests/player-network-backoff.test.cjs tests/vision-outage-resilience.test.cjs tests/offline-expiry.test.cjs tests/player-network.test.cjs tests/player-controls.test.cjs
