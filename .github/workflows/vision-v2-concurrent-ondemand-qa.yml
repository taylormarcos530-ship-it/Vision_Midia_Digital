name: Vision V2 PG17 100-300 Concurrent Compact CQRS AES - NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/concurrent-ondemand-qa/**'
      - '.github/workflows/vision-v2-concurrent-ondemand-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    name: Runner A - synthetic originals retained, encrypted AES archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce isolated branch and no production
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          echo 'NO_SUPABASE=true NO_MAIN=true NO_DEPLOY=true NO_APK=true NO_PANEL=true NO_TV=true NO_DELETE_ORIGINAL=true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Existing verified QA synthetic archive producer
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/qa_archive" "$RUNNER_TEMP/qa_keys"
          python -u tests/vision-v2-sequence-qa/compact-ondemand-qa/compact.py --mode producer --archive "$RUNNER_TEMP/qa_archive" --key-dir "$RUNNER_TEMP/qa_keys"
      - uses: actions/upload-artifact@v4
        with:
          name: qa-concurrent-ciphertext-only
          path: ${{ runner.temp }}/qa_archive/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: qa-concurrent-synthetic-key-NOT-KMS
          path: ${{ runner.temp }}/qa_keys/
          retention-days: 1
          if-no-files-found: error
  benchmark:
    needs: archive
    name: Runner B - 100/300 HTTP, tenant LRU TTL quota, real PG17 original RPC parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce disposable branch and no secrets/prod
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          echo 'NO_SQL_ON_SUPABASE=true NO_PRODUCTION=true NO_DEPLOY=true NO_APK=true NO_PANEL=true NO_SITE=true NO_TV=true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - uses: actions/download-artifact@v4
        with:
          name: qa-concurrent-ciphertext-only
          path: ${{ runner.temp }}/qa_archive/
      - uses: actions/download-artifact@v4
        with:
          name: qa-concurrent-synthetic-key-NOT-KMS
          path: ${{ runner.temp }}/qa_keys/
      - name: 100 + 300 concurrent HTTP report/export, P95 P99, PG17, cache, network-failure
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/concurrent-ondemand-qa/benchmark.py --archive "$RUNNER_TEMP/qa_archive" --key-dir "$RUNNER_TEMP/qa_keys"
          echo 'VISION_V2_300_HTTP_CONCURRENT_QA=PASS'
      - name: Confirm originals untouched
        if: always()
        run: echo 'NO_SUPABASE=true NO_DELETE=true NO_APK=true NO_PRODUCTION=true'
