name: Patch Unified Master Panel
on:
  push:
    branches: [feature/unified-master-panel]
    paths:
      - '.github/patch_unified_master_panel.py'
      - '.github/workflows/patch-unified-master-panel.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-master-panel
          fetch-depth: 0
      - name: Apply scoped patch
        run: python .github/patch_unified_master_panel.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check saas-shell.js
          node --check master.js
          node --check master-payment.js
          node --check master-embed.js
      - name: Validate focused markers
        run: |
          grep -q 'Dashboard Operacional' index.html
          grep -q 'saas-admin-nav' index.html
          grep -q 'view-saas-admin' index.html
          grep -q 'access-refresh-status' index.html
          grep -q 'saas-shell.js' index.html
          grep -q 'master-embed.js' master.html
          grep -q 'UNIFIED_MASTER_PANEL' styles.css
          grep -q 'MASTER_EMBED_MODE' master.css
          grep -q 'Acesso ainda não liberado' app.js
      - name: Remove temporary patch files
        run: rm -f .github/patch_unified_master_panel.py .github/workflows/patch-unified-master-panel.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: unify operational and SaaS Master navigation'
          git push origin feature/unified-master-panel
