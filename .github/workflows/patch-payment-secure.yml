name: Patch Secure Payment Persistence
on:
  push:
    branches: [main]
    paths:
      - '.github/patch_payment_secure.py'
      - '.github/workflows/patch-payment-secure.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patch_payment_secure.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check master.js
      - name: Validate secure persistence
        run: |
          grep -q 'payment_url:paymentUrl' master.js
          ! grep -q 'savePaymentUrlRequest' master.js
          grep -q 'readOnlyRefresh' app.js
          grep -q 'readOnlyRefresh' master.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js master.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: persist payment link through secure Master endpoint'
          git push origin main
