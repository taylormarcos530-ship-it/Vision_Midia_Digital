name: Vision V2 Redis7 Dual Authority WSS Replay Rollback Negative NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-toctou-continuous-guard-qa-20261102
    paths:
      - 'tests/vision-v2-sequence-qa/redis-wss-fault-qa/**'
      - '.github/workflows/vision-v2-redis-wss-splitbrain-rollback-fault-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  redis-wss-negative:
    name: Dual Redis7 real WSS instances split authority and restart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis_primary:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis_secondary:
        image: redis:7.4-alpine
        ports: [6380:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert disposable branch and no production credentials
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-toctou-continuous-guard-qa-20261102
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          test -z "${PGSERVICE:-}"
          test -z "${REDIS_URL:-}"
          echo 'NO_DEPLOY=1 QA_STREAM_GUARD_GROUP=1 DRAIN_DISABLED=1'
      - name: Install pinned synthetic WSS and SQL libraries
        run: python -m pip install 'psycopg[binary,pool]==3.2.6' 'redis==5.2.1' 'websockets==14.2'
      - name: Temporary trusted local certificate only
        run: |
          set -euo pipefail
          mkdir -p qa-only-fault-certs
          chmod 700 qa-only-fault-certs
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout qa-only-fault-certs/local.key \
            -out qa-only-fault-certs/local.pem \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          chmod 600 qa-only-fault-certs/local.key
      - name: Syntax check independent WSS fault harness
        run: python -m py_compile tests/vision-v2-sequence-qa/redis-wss-fault-qa/adversarial.py
      - name: Execute actual WSS TLS Redis stop/start and simulated split-brain rollback
        env:
          QA_STREAM_GUARD_GROUP: '1'
          QA_CERT: qa-only-fault-certs/local.pem
          QA_KEY: qa-only-fault-certs/local.key
          QA_REDIS_PRIMARY_CONTAINER: ${{ job.services.redis_primary.id }}
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/redis-wss-fault-qa/adversarial.py | tee qa-redis-wss-fault.log
      - name: Explicit negative verdict required
        run: |
          python - <<'PY'
          import json
          x=json.load(open("qa-v2-redis-wss-adversarial.json"))
          assert x["production_GO"] is False
          assert x["split_brain"]["same_JWT_accepted_across_Redis_authorities"] is True
          assert x["Redis_state_rollback"]["spent_JTI_reaccepted_after_redis_flush_and_owner_restore"] is True
          assert x["primary_Redis_outage"]["no_heartbeat_ack_while_down"] is True
          assert x["same_Redis_stale_lease"]["old_session_denied"] is True
          print("NEGATIVE_DEFECT_REPRODUCED=true SECURITY_VERDICT=FAIL_NO_GO")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redis7-wss-negative-proof
          path: |
            qa-redis-wss-fault.log
            qa-v2-redis-wss-adversarial.json
          retention-days: 14
