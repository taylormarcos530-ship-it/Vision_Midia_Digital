name: Vision V2 Integrated Commercial Gzip Fenced 8 12 20 x64 256 QA NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/integrated-commercial-fence-qa/**'
      - '.github/workflows/vision-v2-integrated-commercial-fence-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-commercial:
    name: Fenced full commercial 100-old 100-new 100-revised rollback, HTTP and SQL cap ${{ matrix.cap }}, chunk ${{ matrix.chunk }}
    strategy:
      fail-fast: false
      matrix:
        cap: [8,12,20]
        chunk: [65536,262144]
    runs-on: ubuntu-latest
    timeout-minutes: 27
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: No production environment or deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          echo "SYNTHETIC_PG17=true NO_OFFICIAL_PRODUCTION=true NO_DEPLOY=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned fixture libraries
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Integrated disk file full 10k JSON hash with advisory fence, changed commercial revision
        env:
          QA_COMMERCIAL_ADMISSIONS: ${{ matrix.cap }}
          QA_PG_POOL_SIZE: ${{ matrix.cap }}
          QA_COMMERCIAL_CHUNK: ${{ matrix.chunk }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/vision-v2-sequence-qa/integrated-commercial-fence-qa/qa.py
          python -u tests/vision-v2-sequence-qa/integrated-commercial-fence-qa/qa.py
          echo "QA_INTEGRATED_FENCE_COMMERCIAL_PASS=true"
  outbox-crashes:
    name: Independent PG17 durable outbox full crash boundary multiprocess replay
    runs-on: ubuntu-latest
    timeout-minutes: 27
    services:
      postgres:
