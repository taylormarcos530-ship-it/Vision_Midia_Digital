name: Vision V2 PG17 Commercial Full HTTP Cutover Revision Rollback QA NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/bounded-fence-qa/commercial_cutover.py'
      - '.github/workflows/vision-v2-commercial-cutover-replay-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-rollback:
    name: Full original 10k events HTTP 100 old + 100 new + 100 revised after rollback, lost-notify fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict branch and production access isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          echo "DISPOSABLE_PG17=true NO_DEPLOY=true NO_OFFICIAL_SUPABASE=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Syntax check
        run: python -m py_compile tests/vision-v2-sequence-qa/bounded-fence-qa/commercial_cutover.py
      - name: Full HTTP SHA-256 commercial revision across cutover, silent invalidation and rollback
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/bounded-fence-qa/commercial_cutover.py
          echo "QA_COMMERCIAL_CUTOVER_PASS=true"
      - name: No official production systems changed
        if: always()
        run: echo "NO_SUPABASE=true NO_APKS=true NO_PANEL=true NO_SITE=true NO_TV=true NO_PRODUCTION_HISTORY=true"
