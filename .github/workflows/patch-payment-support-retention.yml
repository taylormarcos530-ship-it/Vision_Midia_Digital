name: Patch Payment Support Retention
on:
  push:
    branches: [fix/payment-support-retention]
    paths:
      - '.github/patch_payment_support_retention.py'
      - '.github/workflows/patch-payment-support-retention.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payment-support-retention
          fetch-depth: 0
      - name: Apply scoped patch
        run: python .github/patch_payment_support_retention.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check payment-ui.js
          node --check master-payment.js
      - name: Validate focused markers
        run: |
          grep -q "loadPublicConfig();" app.js
          grep -q "Compactando a imagem para WEBP" payment-ui.js
          grep -q "compressReceiptImage" payment-ui.js
          grep -q "Arquivo removido" master-payment.js
          grep -q "compactadas automaticamente para WEBP" index.html
      - name: Remove temporary patch files
        run: rm -f .github/patch_payment_support_retention.py .github/workflows/patch-payment-support-retention.yml
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: payment support refresh and receipt retention'
          git push origin fix/payment-support-retention
