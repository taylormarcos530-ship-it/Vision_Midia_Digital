name: Vision V2 PG17 Causal Audit Original Commercial AES TCP NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - '.github/workflows/vision-v2-causal-full-regression-20261102.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    name: PG17 ${{ matrix.mode }} pool ${{ matrix.pool }} chunk ${{ matrix.chunk }} isolated
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: mixed, pool: 8, chunk: 65536}
          - {mode: mixed, pool: 8, chunk: 262144}
          - {mode: mixed, pool: 12, chunk: 65536}
          - {mode: mixed, pool: 12, chunk: 262144}
          - {mode: mixed, pool: 20, chunk: 65536}
          - {mode: mixed, pool: 20, chunk: 262144}
          - {mode: transport, pool: 8, chunk: 65536}
          - {mode: transport, pool: 8, chunk: 262144}
          - {mode: transport, pool: 12, chunk: 65536}
          - {mode: transport, pool: 12, chunk: 262144}
          - {mode: transport, pool: 20, chunk: 65536}
          - {mode: transport, pool: 20, chunk: 262144}
          - {mode: faults, pool: 12, chunk: 65536}
          - {mode: faults, pool: 12, chunk: 262144}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Branch and official credential guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Original unmodified suite, no deployment
        shell: bash
        env:
          QA_TEST: ${{ matrix.mode }}
          QA_N: '300'
          QA_POOL_SIZE: ${{ matrix.pool }}
          QA_PG_POOL_SIZE: ${{ matrix.pool }}
          QA_COMMERCIAL_ADMISSIONS: ${{ matrix.pool }}
          QA_CHUNK: ${{ matrix.chunk }}
          QA_COMMERCIAL_CHUNK: ${{ matrix.chunk }}
          QA_STREAM_GUARD_GROUP: '1'
        run: |
          set -euo pipefail
          if [ "$QA_TEST" = mixed ]; then
            python -u tests/vision-v2-sequence-qa/secure-pool-qa/mixed_300.py | tee qa-regression.log
          elif [ "$QA_TEST" = transport ]; then
            python -u tests/vision-v2-sequence-qa/secure-pool-qa/multiprocess_socket_fence_qa.py | tee qa-regression.log
          else
            python -u tests/vision-v2-sequence-qa/secure-pool-qa/faults.py | tee qa-regression.log
          fi
      - name: Keep real stdout and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-${{ matrix.mode }}-p${{ matrix.pool }}-c${{ matrix.chunk }}
          path: qa-regression.log
          if-no-files-found: warn
          retention-days: 14
