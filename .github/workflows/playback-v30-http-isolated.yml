name: Vision V30 HTTP gateway isolated QA
on:
  push:
    branches:
      - fix/playback-daily-retention-safe-20261030
    paths:
      - 'tests/v30-device-gateway-http-integration.cjs'
      - 'tests/v30-http-qa-fixture.sql'
      - 'supabase/functions/device-gateway/index.ts'
      - '.github/workflows/playback-v30-http-isolated.yml'
  workflow_dispatch:
jobs:
  full-http-local:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vision_v30_http_ci
          POSTGRES_PASSWORD: local_qa_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v30_http_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: vision_v30_http_ci
      PGPASSWORD: local_qa_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client locally
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Create only synthetic PostgreSQL schema, ledger and local credentials
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/v30-postgres-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_compaction_staged.sql
          psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_dedupe_guard.sql
          psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_packed_ledger_qa.sql
          psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_segmented_ledger_qa.sql
          psql -v ON_ERROR_STOP=1 -f tests/v30-http-qa-fixture.sql
      - name: Run actual complete gateway handler over localhost HTTP
        run: node tests/v30-device-gateway-http-integration.cjs
