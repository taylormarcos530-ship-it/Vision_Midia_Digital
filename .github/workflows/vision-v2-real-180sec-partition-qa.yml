name: Vision V2 Real 180s Docker Backend Partition PG17 QA NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - '.github/workflows/vision-v2-real-180sec-partition-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-partition:
    name: REAL 183s network cut two Docker containers PG17, 60s reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      QA_NETWORK_LEASE_SECONDS: '180'
      QA_NETWORK_RECONCILE_SECONDS: '60'
      QA_NETWORK_CUT_SECONDS: '183'
      QA_NETWORK_PULSE_SECONDS: '60'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Block other branches, production tokens and deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          echo "NO_PRODUCTION=true NO_DEPLOY=true 180S_REAL_WALL_CLOCK=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: QA isolated PostgreSQL driver
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6'
      - name: Build unprivileged container
        run: docker build -f tests/vision-v2-sequence-qa/network-namespaces-qa/Dockerfile -t v2qa-network-replica:ci .
      - name: Real >=180s backend network disconnect, fail-closed, recovery and 100-300 HTTP
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/network-namespaces-qa/orchestrate.py
          echo "QA_REAL_180S_PARTITION_PASS=true"
      - name: Clean disposable Docker networks, containers and DB
        if: always()
        shell: bash
        run: |
          docker rm -f v2qa_a v2qa_b v2qa_pg 2>/dev/null || true
          docker network rm v2qa_front v2qa_back 2>/dev/null || true
          echo "NO_APK=true NO_PANEL=true NO_SITE=true NO_TVS=true"
