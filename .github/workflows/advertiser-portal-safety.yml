name: Advertiser Portal Safety Tests

on:
  push:
    branches:
      - fix/advertiser-portal-safety-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Protect live player, APK and operational APIs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-vercel-homologation.cjs
          # Only the fully tested Master navigation revision is permitted; no general Master bypass.
          test "$(git hash-object master.html)" = "da166564d7239144b3adc4063227b081785f460c"
          test "$(git hash-object master.js)" = "4fc4dfa717aecc4b869cd1176803742382c0cfe1"
          BASE=87d907010db614d5459b6af9c7b421328e64f225
          git cat-file -e "${BASE}^{commit}"
          if ! git diff --quiet "${BASE}" HEAD -- \
            player.js player.html player.css player.webmanifest \
            android-player/ config.js sw.js \
            index.html app.js  \
            supabase/functions/device-gateway/index.ts \
            supabase/functions/device-control/ \
            supabase/functions/device-monitoring/ \
            supabase/functions/master-admin/index.ts \
            netlify.toml; then
            echo "::error::Protected player or production file changed. Stop and review before any deployment."
            exit 1
          fi
          echo "Protected files unchanged from isolated feature baseline."

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run regression and isolated PostgreSQL tests
        run: npm test

# No secrets, APK build, remote SQL, Edge Function release, or production deploy.
