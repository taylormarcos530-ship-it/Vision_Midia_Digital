name: Vision Supabase Free traffic safety (isolated)
on:
  push:
    branches:
      - fix/vision-supabase-free-traffic-isolated-20261027
    paths:
      - player.js
      - tests/player-supabase-traffic-safety.test.cjs
      - tests/player-network-backoff.test.cjs
      - tests/player-traffic-telemetry.test.cjs
      - tests/vision-supabase-free-budget.test.cjs
      - scripts/vision-supabase-free-budget.cjs
      - tests/vision-homolog-apk-safety.test.cjs
      - android-player/app/build.gradle
      - scripts/vision-qa-signing-check.sh
      - scripts/vision-qa-generate-signing.sh
      - .gitignore
      - android-player/app/src/main/AndroidManifest.xml
      - android-player/app/src/main/java/com/visionmidia/player/MainActivity.java
      - .github/workflows/vision-supabase-free-traffic-isolated.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  traffic-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check player.js
          node --check master.js
      - name: Regression and traffic safety tests
        run: node --test tests/player-traffic-telemetry.test.cjs tests/vision-homolog-apk-safety.test.cjs tests/player-supabase-traffic-safety.test.cjs tests/vision-supabase-free-budget.test.cjs tests/player-network-backoff.test.cjs tests/vision-outage-resilience.test.cjs tests/offline-expiry.test.cjs tests/player-network.test.cjs tests/master-outage-recovery.test.cjs
      - name: Verify one-time operator key generation with disposable identity
        shell: bash
        run: |
          set -euo pipefail
          TEST_HOME="$(mktemp -d)"
          trap 'rm -rf "$TEST_HOME"' EXIT
          TMP_PASSWORD='disposable-key-ci-2026-no-user-secret'
          printf '%s\n%s\n' "$TMP_PASSWORD" "$TMP_PASSWORD" \
            | HOME="$TEST_HOME" bash scripts/vision-qa-generate-signing.sh
          test -s "$TEST_HOME/vision-qa-signing/vision-qa-homolog.p12"
          test "$(stat -c '%a' "$TEST_HOME/vision-qa-signing/vision-qa-homolog.p12")" = 600
          if HOME="$TEST_HOME" bash scripts/vision-qa-generate-signing.sh; then
            echo 'ERROR: second invocation must never replace owner key' >&2
            exit 1
          fi
          echo 'One-time generated key, file permissions and overwrite refusal verified.'
      - name: Prepare Android debug-only test assets
        run: |
          mkdir -p android-player/app/src/main/assets
          cp player.html player.css player.js config.js icon.svg player.webmanifest sw.js clock.html news-feed.html news-feed.css news-feed.js android-player/app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug baseline and separate QA Android package (not production)
        run: gradle -p android-player --no-daemon assembleDebug assembleHomolog
      - name: Verify QA APK package identifier and boot receiver disabled
        run: |
          set -eu
          test -s android-player/app/build/outputs/apk/debug/app-debug.apk
          QA_APK=android-player/app/build/outputs/apk/homolog/app-homolog.apk
          test -s "$QA_APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$QA_APK" | grep -F "package: name='com.visionmidia.player.homolog'"
          "$AAPT" dump xmltree "$QA_APK" AndroidManifest.xml > qa-android-manifest-check.txt
          grep -F "com.visionmidia.player.BootReceiver" qa-android-manifest-check.txt
          grep -F "android:enabled" qa-android-manifest-check.txt
          sha256sum "$QA_APK"
      - name: Verify QA signing certificate only (no APK distribution)
        run: |
          set -eu
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android-player/app/build/outputs/apk/homolog/app-homolog.apk | grep -F 'Signer #1 certificate SHA-256 digest:'
          echo 'WARNING: This ephemeral debug-signed APK cannot update an installed QA app.'
          echo 'The APK is deliberately NOT uploaded or published. Stable operator-owned key is required.'

      - name: Exercise stable-signer code path using CI-only disposable identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$RUNNER_TEMP/vision-ci-disposable-signing.p12"
          # Deliberately public, disposable test-only password; NOT a production credential.
          TEST_PASSWORD='throwaway-ci-test-pass-2026'
          keytool -genkeypair -noprompt -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=DISPOSABLE Vision CI Test, O=DO NOT DISTRIBUTE' \
            -alias vision_ci_test_only -keystore "$KEY_FILE" \
            -storepass "$TEST_PASSWORD" -keypass "$TEST_PASSWORD"
          export VISION_QA_KEYSTORE_FILE="$KEY_FILE"
          export VISION_QA_KEYSTORE_PASSWORD="$TEST_PASSWORD"
          export VISION_QA_KEY_ALIAS='vision_ci_test_only'
          export VISION_QA_KEY_PASSWORD="$TEST_PASSWORD"
          export VISION_QA_EXPECTED_CERT_SHA256="$(keytool -list -v -keystore "$KEY_FILE" \
            -storepass "$TEST_PASSWORD" -alias "$VISION_QA_KEY_ALIAS" \
            | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':')"
          bash scripts/vision-qa-signing-check.sh
          echo 'CI-only signer path validated. Do NOT distribute this APK.'
          rm -f "$KEY_FILE"

