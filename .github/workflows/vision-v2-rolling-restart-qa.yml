name: Vision V2 Rolling Restart 100-300 Full RPC Gzip JWT QA - NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/rolling-restart-qa/**'
      - '.github/workflows/vision-v2-rolling-restart-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rolling:
    name: Two OS process rolling restart PG17, full gzip HTTP100-300, bounded JWT/RLS revocation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Branch and production-credentials hard guards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          echo "DISPOSABLE_PG17=true NO_PRODUCTION=true NO_DEPLOY=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Syntax validation
        run: python -m py_compile tests/vision-v2-sequence-qa/rolling-restart-qa/qa.py
      - name: Real rolling handover while old replica serves complete export, auth event revocation
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/rolling-restart-qa/qa.py
          echo "QA_ROLLING_RESTART_PASS=true"
      - name: No deployment
        if: always()
        run: echo "NO_SUPABASE=true NO_APK=true NO_TV=true NO_SITE=true NO_PANEL=true NO_REAL_HISTORY=true"
  remote-regression:
    name: Independent PG17 durable outbox AES remote forced-crash and cold HTTP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Branch and secrets isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          echo "NO_PRODUCTION=true NO_DEPLOY=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Validate AES-GCM remote object restart, durable outbox and genuine cold HTTP baseline
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/cold-remote-qa/qa.py
          echo "QA_REMOTE_ROLLING_REGRESSION_PASS=true"
      - name: No deployment
        if: always()
        run: echo "NO_SUPABASE=true NO_APK=true NO_TV=true NO_SITE=true NO_REAL_HISTORY=true"
