name: Apply Signage V2 UI

on:
  push:
    branches: [stage-signage-v2]
    paths:
      - 'tools/patch_signage_v2_ui.py'
      - '.github/workflows/patch-signage-v2-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage-signage-v2
      - name: Apply patch
        run: python tools/patch_signage_v2_ui.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate HTML markers
        run: |
          grep -q 'playlist-schedule-dialog' index.html
          grep -q 'player-branding-form' index.html
          grep -q 'data-capture-device' app.js
          grep -q 'persistPlaylistOrder' app.js
          grep -q 'SIGNAGE_V2_UI' styles.css
          git diff --check
      - name: Commit changes
        run: |
          git config user.name 'taylormarcos530-ship-it'
          git config user.email 'taylormarcos530@gmail.com'
          git add index.html styles.css app.js
          if git diff --cached --quiet; then
            echo 'No UI changes to commit'
          else
            git commit -m 'feat: signage v2 playlist scheduling screenshots and compact media UI'
            git push origin stage-signage-v2
          fi
