name: Build Signed Vision Player APK

on:
  workflow_dispatch:
  push:
    branches: [fix/android-tv-native-rotation-20261020, fix/android-tv-icon-1520-preview-20261021]
    paths:
      - 'android-player/**'
      - 'player.js'
      - '.github/workflows/build-signed-android-player.yml'

permissions:
  contents: write

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record release source
        shell: bash
        run: |
          set -euo pipefail
          echo "Building ref: $GITHUB_REF"
          echo "Building commit: $GITHUB_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'ANDROID_KEYSTORE_BASE64 ausente'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'ANDROID_KEYSTORE_PASSWORD ausente'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS ausente'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD ausente'; exit 1; }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle current web player into APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-player/app/src/main/assets
          cp player.html player.css player.js config.js icon.svg player.webmanifest sw.js clock.html news-feed.html news-feed.css news-feed.js android-player/app/src/main/assets/

      - name: Validate player JavaScript
        run: node --check player.js

      - name: Embed current Master favicon in Android launcher icon
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import io, json, re, urllib.request
          from pathlib import Path
          from PIL import Image
          base='https://vision-midia-digital.vercel.app'
          with urllib.request.urlopen(base+'/app-icon-config',timeout=20) as r:
              config=json.load(r)
          icons=config.get('icons') or []
          icon=next((i for i in icons if i.get('sizes')=='512x512' and i.get('purpose')=='any'),None)
          if not icon or not re.fullmatch(r'/app-icons/[0-9a-f-]{36}/512\.png',icon.get('src',''),re.I):
              raise RuntimeError('Master favicon not configured; refusing to build placeholder V')
          with urllib.request.urlopen(base+icon['src'],timeout=30) as r:
              raw=r.read(5_000_001)
          if len(raw)>5_000_000: raise RuntimeError('Icon too large')
          image=Image.open(io.BytesIO(raw)).convert('RGBA')
          image.thumbnail((512,512))
          canvas=Image.new('RGBA',(512,512),(11,18,32,255))
          canvas.alpha_composite(image,((512-image.width)//2,(512-image.height)//2))
          path=Path('android-player/app/src/main/res/drawable-nodpi/ic_vision_player.png')
          path.parent.mkdir(parents=True,exist_ok=True)
          canvas.save(path)
          Path('android-player/app/src/main/res/drawable/ic_vision_player.xml').unlink()
          print('Embedded configured Master favicon into Android launcher icon')
          PY

      - name: Build unsigned release APK
        run: gradle -p android-player --no-daemon assembleRelease

      - name: Decode signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > /tmp/vision-release.jks
          chmod 600 /tmp/vision-release.jks

      - name: Verify permanent signing identity
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 scripts/verify-android-signing-key.py /tmp/vision-release.jks android-player/signing-certificate.sha256

      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK_IN='android-player/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK_IN"
          mkdir -p downloads
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/vision-release.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out downloads/Vision-Player.apk \
            "$APK_IN"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs downloads/Vision-Player.apk
          ACTUAL_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs downloads/Vision-Player.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$ACTUAL_CERT" = "$(tr -d '[:space:]' < android-player/signing-certificate.sha256)" || { echo 'APK signing identity mismatch'; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging downloads/Vision-Player.apk > /tmp/vision-stable-badging.txt
          sha256sum downloads/Vision-Player.apk > downloads/Vision-Player.sha256

      - name: Record Player source fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re
          files = ['player.html', 'player.css', 'player.js', 'config.js', 'icon.svg', 'player.webmanifest', 'sw.js', 'clock.html', 'news-feed.html', 'news-feed.css', 'news-feed.js']
          payload = ''.join(f"{name}\n{Path(name).read_text()}\n" for name in files)
          badging = Path('/tmp/vision-stable-badging.txt').read_text()
          package = re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", badging)
          assert package and package.group(1) == 'com.visionmidia.player.stable', 'Incorrect stable package identity'
          assert 'application-debuggable' not in badging, 'Stable APK cannot be debuggable'
          data = {
              'source_sha256': hashlib.sha256(payload.encode()).hexdigest(),
              'git_sha': os.environ.get('GITHUB_SHA', ''),
              'apk_version': package.group(3),
              'version_code': int(package.group(2)),
              'application_id': package.group(1),
              'signer_sha256': Path('android-player/signing-certificate.sha256').read_text().strip(),
              'apk_sha256': hashlib.sha256(Path('downloads/Vision-Player.apk').read_bytes()).hexdigest(),
              'files': files,
          }
          Path('downloads/Vision-Player.source.json').write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vision-Player-signed
          path: |
            downloads/Vision-Player.apk
            downloads/Vision-Player.sha256
            downloads/Vision-Player.source.json
          retention-days: 90

      - name: Store signed APK on isolated branch
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/vision-signed-output
          cp downloads/Vision-Player.apk downloads/Vision-Player.sha256 downloads/Vision-Player.source.json /tmp/vision-signed-output/
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          cp /tmp/vision-signed-output/* downloads/
          git add -f downloads/Vision-Player.apk downloads/Vision-Player.sha256 downloads/Vision-Player.source.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: stage signed Android APK on isolated branch'
          git push origin "HEAD:$GITHUB_REF_NAME"
