name: Vision V30 isolated PostgreSQL 17 verification
on:
  push:
    branches:
      - fix/playback-daily-retention-safe-20261030
    paths:
      - 'supabase/qa-migrations/v30_playback_compaction_staged.sql'
      - 'tests/playback-compaction-v30.test.cjs'
      - 'tests/v30-postgres-fixture.sql'
      - 'tests/v30-postgres-assertions.sql'
      - 'supabase/qa-migrations/v30_playback_dedupe_guard.sql'
      - 'tests/v30-dedupe-static.test.cjs'
      - 'tests/v30-postgres-dedupe-assertions.sql'
      - 'tests/v30-postgres-concurrency.sh'
      - 'supabase/qa-migrations/v30_playback_packed_ledger_qa.sql'
      - 'tests/v30-postgres-packed-assertions.sql'
      - 'tests/v30-postgres-packed-concurrency.sh'
      - 'tests/v30-seven-day-retention-scale.sql'
      - 'tests/v30-packed-ledger-scale.sql'
      - 'tests/v30-backup-restore-disposable.sh'
      - 'tests/v30-ledger-baseline-scale.sql'
      - 'supabase/qa-migrations/v30_playback_segmented_ledger_qa.sql'
      - 'tests/v30-segmented-ledger-scale.sql'
      - 'tests/v30-segmented-backup-restore-disposable.sh'
      - 'tests/v30-segmented-concurrency.sh'
      - '.github/workflows/playback-v30-postgres-isolated.yml'
  workflow_dispatch:
jobs:
  synthetic-sql-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: vision_v30_disposable_ci
          POSTGRES_PASSWORD: local_only_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v30_disposable_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: vision_v30_disposable_ci
      PGPASSWORD: local_only_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript unit tests
        run: |
          node --test tests/playback-compaction-v30.test.cjs
          node --test tests/v30-dedupe-static.test.cjs
      - name: Install PostgreSQL client on disposable runner
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Load exclusively synthetic schema and staged V30 migration
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/v30-postgres-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_compaction_staged.sql
      - name: SQL assertions against synthetic data only
        run: psql -v ON_ERROR_STOP=1 -f tests/v30-postgres-assertions.sql

      - name: Dedupe V30 in separate disposable PostgreSQL 17 database
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE vision_v30_dedupe_ci'
          sed '/^CREATE ROLE /d' tests/v30-postgres-fixture.sql | PGDATABASE=vision_v30_dedupe_ci psql -v ON_ERROR_STOP=1
          PGDATABASE=vision_v30_dedupe_ci psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_compaction_staged.sql
          PGDATABASE=vision_v30_dedupe_ci psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_dedupe_guard.sql
          PGDATABASE=vision_v30_dedupe_ci psql -v ON_ERROR_STOP=1 -f tests/v30-postgres-dedupe-assertions.sql
      - name: 'Real concurrent PostgreSQL sessions - archive versus late replay'
        env:
          PGDATABASE: vision_v30_dedupe_ci
        run: bash tests/v30-postgres-concurrency.sh

      - name: Packed dedupe V30 in third disposable PostgreSQL 17 database
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE vision_v30_packed_ci'
          sed '/^CREATE ROLE /d' tests/v30-postgres-fixture.sql | PGDATABASE=vision_v30_packed_ci psql -v ON_ERROR_STOP=1
          PGDATABASE=vision_v30_packed_ci psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_compaction_staged.sql
          PGDATABASE=vision_v30_packed_ci psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_dedupe_guard.sql
          PGDATABASE=vision_v30_packed_ci psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_packed_ledger_qa.sql
          PGDATABASE=vision_v30_packed_ci psql -v ON_ERROR_STOP=1 -f tests/v30-postgres-packed-assertions.sql
      - name: 'Real concurrent PostgreSQL sessions - packed archive versus late replay'
        env:
          PGDATABASE: vision_v30_packed_ci
        run: bash tests/v30-postgres-packed-concurrency.sh

      - name: Seven-day retention, 300k identity growth and measured write costs (fresh DB)
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE vision_v30_scale_ci'
          sed '/^CREATE ROLE /d' tests/v30-postgres-fixture.sql | PGDATABASE=vision_v30_scale_ci psql -v ON_ERROR_STOP=1
          PGDATABASE=vision_v30_scale_ci psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_compaction_staged.sql
          PGDATABASE=vision_v30_scale_ci psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_dedupe_guard.sql
          PGDATABASE=vision_v30_scale_ci psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_packed_ledger_qa.sql
          PGDATABASE=vision_v30_scale_ci psql -v ON_ERROR_STOP=1 -f tests/v30-seven-day-retention-scale.sql
          PGDATABASE=vision_v30_scale_ci psql -v ON_ERROR_STOP=1 -f tests/v30-packed-ledger-scale.sql
          PGDATABASE=vision_v30_scale_ci psql -v ON_ERROR_STOP=1 -f tests/v30-ledger-baseline-scale.sql
      - name: Encrypted-safe QA backup verification and isolated pg_restore 17
        env:
          PGDATABASE: vision_v30_scale_ci
        run: bash tests/v30-backup-restore-disposable.sh

      - name: Segmented V30 ledgers, 7-day retention, 300k keys and baseline comparison
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE vision_v30_segmented_ci'
          sed '/^CREATE ROLE /d' tests/v30-postgres-fixture.sql | PGDATABASE=vision_v30_segmented_ci psql -v ON_ERROR_STOP=1
          PGDATABASE=vision_v30_segmented_ci psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_compaction_staged.sql
          PGDATABASE=vision_v30_segmented_ci psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_dedupe_guard.sql
          PGDATABASE=vision_v30_segmented_ci psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_packed_ledger_qa.sql
          PGDATABASE=vision_v30_segmented_ci psql -v ON_ERROR_STOP=1 -f supabase/qa-migrations/v30_playback_segmented_ledger_qa.sql
          PGDATABASE=vision_v30_segmented_ci psql -v ON_ERROR_STOP=1 -f tests/v30-seven-day-retention-scale.sql
          PGDATABASE=vision_v30_segmented_ci psql -v ON_ERROR_STOP=1 -f tests/v30-segmented-ledger-scale.sql
          PGDATABASE=vision_v30_segmented_ci psql -v ON_ERROR_STOP=1 -f tests/v30-ledger-baseline-scale.sql
      - name: Segmented archive versus retry - two PostgreSQL sessions
        env:
          PGDATABASE: vision_v30_segmented_ci
        run: bash tests/v30-segmented-concurrency.sh
      - name: Full segmented synthetic pg_dump/pg_restore and replay check
        env:
          PGDATABASE: vision_v30_segmented_ci
        run: bash tests/v30-segmented-backup-restore-disposable.sh
