name: Vision V2 TOCTOU Continuous Gate PG17 Independent NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-toctou-continuous-guard-qa-20261102
    paths:
      - 'tests/vision-v2-sequence-qa/toctou-continuous-qa/**'
      - '.github/workflows/vision-v2-toctou-continuous-gate-pg17-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-adversarial:
    name: Real PG17 guarded GET ${{ matrix.tvs }} TVs pool ${{ matrix.pool }} chunk ${{ matrix.chunk }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tvs: 100, pool: 8, chunk: 65536}
          - {tvs: 100, pool: 12, chunk: 262144}
          - {tvs: 300, pool: 8, chunk: 65536}
          - {tvs: 300, pool: 12, chunk: 262144}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abort if branch or isolation is not exact
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-toctou-continuous-guard-qa-20261102
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          test -z "${REDIS_URL:-}"
          echo 'QA_STREAM_GUARD_GROUP=1 DRAIN_DISABLED=1 PRODUCTION_NO_GO=1'
      - name: Install disposable PG17 driver
        run: python -m pip install 'psycopg[binary]==3.2.6'
      - name: Syntax-check only new isolated files
        run: python -m py_compile tests/vision-v2-sequence-qa/toctou-continuous-qa/worker.py tests/vision-v2-sequence-qa/toctou-continuous-qa/positive.py
      - name: Test continuous gate with 2 real processes and PostgreSQL locks
        shell: bash
        env:
          QA_TVS: ${{ matrix.tvs }}
          QA_POOL: ${{ matrix.pool }}
          QA_CHUNK: ${{ matrix.chunk }}
          QA_STREAM_GUARD_GROUP: '1'
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/toctou-continuous-qa/positive.py | tee qa-continuous-gate.log
      - name: Read outcome as LOCAL ONLY, never production GO
        run: |
          python - <<'PY'
          import json
          x=json.load(open("qa-v2-toctou-continuous-result.json"))
          assert x["test_status"]=="PASS_LOCAL_CANDIDATE",x
          assert x["production_GO"] is False,x
          assert x["exclusive_close_observed_waiting"] is True,x
          assert x["after_COMMIT_HTTP503_from_both_processes"] is True,x
          print("QA_POSITIVE_LOCAL=PASS PRODUCTION=NO_GO")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-gate-${{ matrix.tvs }}-p${{ matrix.pool }}-c${{ matrix.chunk }}
          path: |
            qa-continuous-gate.log
            qa-v2-toctou-continuous-result.json
          retention-days: 14
