name: Finalize Signage V2

on:
  push:
    branches: [stage-signage-v2]
    paths:
      - '.github/workflows/finalize-signage-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-signage-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused patch
        run: python .github/scripts/finalize_signage_v2.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check master.js
          node --check player.js
          node --check sw.js
      - name: Validate required markers
        run: |
          grep -q 'pending_approval' app.js
          grep -q 'player_audio_enabled' master.js
          grep -q 'Programar</button>' app.js
          grep -q 'VisionAndroid' player.js
          grep -q 'KEY_AUTOSTART' android-player/app/src/main/java/com/visionmidia/player/MainActivity.java
      - name: Commit finalized files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js styles.css master.html master.js master.css player.js sw.js android-player/app/src/main/java/com/visionmidia/player/MainActivity.java android-player/app/src/main/java/com/visionmidia/player/BootReceiver.java
          git commit -m 'feat: finalize SaaS approval scheduling and player controls'
          git push origin HEAD:stage-signage-v2
