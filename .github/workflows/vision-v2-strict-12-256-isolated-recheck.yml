name: Vision V2 Independent 100 client pool12 256KiB recheck NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - .github/workflows/vision-v2-strict-12-256-isolated-recheck.yml
permissions:
  contents: read
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Experimental-only sandbox guard
        run: |
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${DATABASE_URL:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6'
      - name: Confirm delayed scheduler real and halfopen partial HTTP in pool12 256KiB
        env:
          QA_N: '100'
          QA_POOL_SIZE: '12'
          QA_CHUNK: '262144'
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/secure-pool-qa/strict_deadline_tcp_qa.py
          echo "QA_STRICT_RECHECK_PASS=true"
