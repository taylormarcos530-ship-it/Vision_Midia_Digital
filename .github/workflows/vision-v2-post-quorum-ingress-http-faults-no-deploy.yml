name: Vision V2 Post Quorum Ingress HTTP Faults Regression NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-toctou-continuous-guard-qa-20261102
    paths:
      - 'tests/vision-v2-sequence-qa/block-fence-qa/**'
      - '.github/workflows/vision-v2-post-quorum-ingress-http-faults-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  block-fence:
    name: PG17 block fence ${{ matrix.tvs }} clients / ${{ matrix.chunk }} byte chunk
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tvs: 100, chunk: 65536}
          - {tvs: 100, chunk: 262144}
          - {tvs: 300, chunk: 65536}
          - {tvs: 300, chunk: 262144}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abort without isolated branch and credentials segregation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-toctou-continuous-guard-qa-20261102
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          test -z "${PGSERVICE:-}"
          test -z "${REDIS_URL:-}"
          echo 'QA_STREAM_GUARD_GROUP=1 NO_DEPLOY=1 DRAIN_DISABLED=1'
      - run: python -m pip install 'psycopg[binary]==3.2.6'
      - name: Compile only disposable test sources
        run: python -m py_compile tests/vision-v2-sequence-qa/block-fence-qa/worker.py tests/vision-v2-sequence-qa/block-fence-qa/verify.py
      - name: Actual two OS processes, socket backpressure, SQL writer and SIGKILL
        env:
          QA_TVS: ${{ matrix.tvs }}
          QA_POOL: '12'
          QA_CHUNK: ${{ matrix.chunk }}
          QA_STREAM_GUARD_GROUP: '1'
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/block-fence-qa/verify.py | tee qa-v2-block-fence.log
      - name: Verify no claim of physical TCP revocation or production release
        run: |
          python - <<'PY'
          import json
          x=json.load(open('qa-v2-block-fence-ledger.json'))
          assert x['QA']=='PASS_LOCAL_CANDIDATE_WITH_KNOWN_HTTP200_TRUNCATION'
          assert x['production_GO'] is False
          assert x['cutoff_after_first_chunk']['wire_status']==200
          assert x['cutoff_after_first_chunk']['application_valid'] is False
          assert x['slow_TCP_reader']['revoke_ms']<750
          assert x['SIGKILL_while_guard_held']['revocation_ms']<750
          print('BLOCK_FENCE_LOCAL_PASS=true HTTP200_PARTIAL_REQUIRES_SHA=true PRODUCTION_NO_GO=1')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg17-block-fence-t${{ matrix.tvs }}-c${{ matrix.chunk }}
          path: |
            qa-v2-block-fence.log
            qa-v2-block-fence-ledger.json
          retention-days: 14
