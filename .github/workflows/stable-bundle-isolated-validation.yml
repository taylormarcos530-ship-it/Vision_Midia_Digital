name: Vision stable bundle isolated validation
on:
  push:
    branches:
      - perf/stable-1524-bundle-stagger-isolated-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stable-bundle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check player.js
      - run: node --test tests/stable-bundle-scheduling.test.mjs
