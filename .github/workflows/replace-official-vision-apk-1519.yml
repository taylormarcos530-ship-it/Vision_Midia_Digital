name: Replace official Vision Player APK with 1.5.19
on:
  push:
    branches: [release/vision-player-1-5-14-apk-only]
    paths: ['.github/workflows/replace-official-vision-apk-1519.yml']
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/vision-player-1-5-14-apk-only
      - name: Replace official download with 1.5.19
        run: |
          set -euo pipefail
          test -s downloads/Vision-Player-1.5.19-preview.apk
          cp downloads/Vision-Player-1.5.19-preview.apk downloads/Vision-Player.apk
          sha256sum downloads/Vision-Player.apk
          git add downloads/Vision-Player.apk
          git -c user.name="Vision CI" -c user.email="vision-ci@users.noreply.github.com" commit -m "release: replace official Vision Player download with 1.5.19"
          git push origin HEAD:release/vision-player-1-5-14-apk-only
