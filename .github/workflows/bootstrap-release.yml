name: Bootstrap Vision Midia Digital RC

on:
  push:
    paths:
      - '.github/workflows/bootstrap-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild release archive
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/vision.b64
          cat .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 .bootstrap/part-03 >> /tmp/vision.b64
          head -c 18000 .bootstrap/part-04 >> /tmp/vision.b64
          cat .bootstrap/part-05 >> /tmp/vision.b64
          head -c 240 .bootstrap/part-06 >> /tmp/vision.b64
          test "$(wc -c < /tmp/vision.b64)" -eq 108240
          echo 'b3594131c197fe761d9a1118d450da86a02f88d615121326d8e0d0d895c0f40c  /tmp/vision.b64' | sha256sum -c -
          base64 --decode /tmp/vision.b64 > /tmp/vision-src.tgz
          test "$(wc -c < /tmp/vision-src.tgz)" -eq 81178
          echo 'be28dc6f5e6bf1eb94c13d44d8299d38f8ae26f7f3596aeb98c7575e34919dd9  /tmp/vision-src.tgz' | sha256sum -c -
          tar -xzf /tmp/vision-src.tgz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-release.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f master.html
          test -f master.js
          test -f master.css
          test -f player.html
          test -f player.js
          test -f player.css
          test -f vercel.json
          test -f supabase/functions/master-admin/index.ts
          node --check app.js
          node --check master.js
          node --check player.js
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool player.webmanifest >/dev/null
          python -m json.tool vercel.json >/dev/null
          if grep -RIlE 'sb_secret_[A-Za-z0-9_-]+|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+' --exclude-dir=.git .; then
            echo 'Potential secret value found in source.' >&2
            exit 1
          fi

      - name: Commit reconstructed release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vision-release-bot'
          git config user.email 'vision-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'release: publish Vision Midia Digital RC final'
          git push origin HEAD:main
