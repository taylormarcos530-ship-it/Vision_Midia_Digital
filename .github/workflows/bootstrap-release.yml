name: Bootstrap Vision Midia Digital RC

on:
  push:
    paths:
      - '.github/workflows/bootstrap-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair transferred chunks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          def git_blob_sha(data: bytes) -> str:
              header = f"blob {len(data)}\0".encode()
              return hashlib.sha1(header + data).hexdigest()

          def repair(path: str, expected_size: int, expected_sha: str, remove_len: int):
              p = Path(path)
              data = p.read_bytes()
              if len(data) == expected_size and git_blob_sha(data) == expected_sha:
                  print(path, 'already correct')
                  return
              if len(data) != expected_size + remove_len:
                  raise SystemExit(f'{path}: unexpected size {len(data)}')
              for i in range(len(data) - remove_len + 1):
                  candidate = data[:i] + data[i + remove_len:]
                  if git_blob_sha(candidate) == expected_sha:
                      p.write_bytes(candidate)
                      print(path, f'repaired by removing {remove_len} byte(s) at offset {i}')
                      return
              raise SystemExit(f'{path}: could not repair against expected git blob sha')

          repair('.bootstrap/part-04', 18000, 'a8f3753e772df846702519c10b2f6603be51aa4b', 1)
          repair('.bootstrap/part-06', 240, 'b7ee4d52e13bd20ed2d231fcb0d1d26096ed8cea', 16)
          PY

      - name: Rebuild release archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 .bootstrap/part-03 .bootstrap/part-04 .bootstrap/part-05 .bootstrap/part-06 > /tmp/vision.b64
          test "$(wc -c < /tmp/vision.b64)" -eq 108240
          echo 'b3594131c197fe761d9a1118d450da86a02f88d615121326d8e0d0d895c0f40c  /tmp/vision.b64' | sha256sum -c -
          base64 --decode /tmp/vision.b64 > /tmp/vision-src.tgz
          test "$(wc -c < /tmp/vision-src.tgz)" -eq 81178
          echo 'be28dc6f5e6bf1eb94c13d44d8299d38f8ae26f7f3596aeb98c7575e34919dd9  /tmp/vision-src.tgz' | sha256sum -c -
          tar -xzf /tmp/vision-src.tgz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-release.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f master.html
          test -f master.js
          test -f master.css
          test -f player.html
          test -f player.js
          test -f player.css
          test -f vercel.json
          test -f supabase/functions/master-admin/index.ts
          node --check app.js
          node --check master.js
          node --check player.js
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool player.webmanifest >/dev/null
          python -m json.tool vercel.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          import re

          patterns = [
              re.compile(rb'sb_secret_[A-Za-z0-9_-]+'),
              re.compile(rb'SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*["\'][^"\']+["\']'),
          ]
          hits = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try:
                  data = p.read_bytes()
              except OSError:
                  continue
              if any(rx.search(data) for rx in patterns):
                  hits.append(str(p))
          if hits:
              raise SystemExit('Potential secret value found in: ' + ', '.join(hits))
          print('Secret scan: OK')
          PY

      - name: Commit reconstructed release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vision-release-bot'
          git config user.email 'vision-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'release: publish Vision Midia Digital RC final'
          git push origin HEAD:main
