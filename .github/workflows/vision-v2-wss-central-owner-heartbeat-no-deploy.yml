name: Vision V2 Central Owner and Live Witness Heartbeat No Deploy
on:
  push:
    branches:
      - experiment/vision-v2-toctou-continuous-guard-qa-20261102
    paths:
      - 'tests/vision-v2-sequence-qa/redis-wss-fault-qa/central-owner-heartbeat-candidate.py'
      - 'tests/vision-v2-sequence-qa/redis-wss-fault-qa/partition-forwarder.py'
      - '.github/workflows/vision-v2-wss-central-owner-heartbeat-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  witness-adversarial:
    name: PG17 centralized owner, live heartbeat authority, dual Redis and actual restore
    runs-on: ubuntu-latest
    timeout-minutes: 24
    services:
      postgres_main:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      postgres_witness:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_witness_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-witness-password
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_witness_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      postgres_shadow:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_witness_shadow_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-shadow-password
        ports: [5435:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_witness_shadow_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis_primary:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis_secondary:
        image: redis:7.4-alpine
        ports: [6380:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse official credentials and foreign branches
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-toctou-continuous-guard-qa-20261102
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          test -z "${PGSERVICE:-}"
          test -z "${REDIS_URL:-}"
          echo 'NO_DEPLOY=1 QA_STREAM_GUARD_GROUP=1 DRAIN_DISABLED=1'
      - run: python -m pip install 'psycopg[binary,pool]==3.2.6' 'redis==5.2.1' 'websockets==14.2'
      - name: Ephemeral localhost TLS only
        run: |
          set -euo pipefail
          mkdir -p qa-restore-certs
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout qa-restore-certs/local.key -out qa-restore-certs/local.pem \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          chmod 600 qa-restore-certs/local.key
      - name: Syntax and separate PG17/Redis service checks
        run: |
          python -m py_compile tests/vision-v2-sequence-qa/redis-wss-fault-qa/central-owner-heartbeat-candidate.py
          python -m py_compile tests/vision-v2-sequence-qa/redis-wss-fault-qa/partition-forwarder.py
      - name: Test central owner, witness heartbeat fail-closed, real restore and dual authority
        env:
          QA_STREAM_GUARD_GROUP: '1'
          QA_CERT: qa-restore-certs/local.pem
          QA_KEY: qa-restore-certs/local.key
          QA_WITNESS_CONTAINER: ${{ job.services.postgres_witness.id }}
          QA_REDIS_PRIMARY_CONTAINER: ${{ job.services.redis_primary.id }}
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/redis-wss-fault-qa/central-owner-heartbeat-candidate.py | tee qa-wss-central-owner.log
      - name: Verify bounded local FAIL-CLOSED and rollback security FAIL
        run: |
          python - <<'PY'
          import json
          x=json.load(open('qa-v2-wss-central-auth.json'))
          assert x['production_GO'] is False
          assert x['global_owner_and_jti']['wrong_tenant_denied']
          assert x['global_owner_and_jti']['exactly_one_concurrent_JWT_accepted']
          assert x['witness_path_partition']['heartbeat_ACK_when_witness_down'] is False
          assert x['witness_path_partition']['new_logins_denied']
          assert x['global_device_tenant_reassignment']['old_company_login_denied']
          assert x['global_device_tenant_reassignment']['new_company_login_success']
          assert x['witness_PG17_real_logical_restore']['old_signed_JTI_reaccepted']
          assert x['two_PG17_authorities_split_brain']['same_JTI_accepted_twice']
          assert x['SQL_SELECT_per_heartbeat']==1
          assert x['security_verdict']=='NO_GO_RESTORE_AND_DUAL_AUTHORITY_UNSAFE'
          print('LOCAL_HEARTBEAT_OWNER_PASS=true FULL_ROLLBACK_SECURITY_FAIL=true PRODUCTION_NO_GO=1')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg17-central-owner-heartbeat-rollback-adversarial
          path: |
            qa-wss-central-owner.log
            qa-v2-wss-central-auth.json
          retention-days: 14
