name: Patch Plans and TV Viewer
on:
  push:
    branches: [main]
    paths:
      - '.github/patch_plan_view_tv.py'
      - '.github/workflows/patch-plan-view-tv.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patch_plan_view_tv.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate markers
        run: |
          grep -q 'data-view-device' app.js
          grep -q 'view-tv-dialog' index.html
          grep -q 'Não foi possível carregar os planos' app.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: load signup plans reliably and add TV viewer'
          git push origin main
