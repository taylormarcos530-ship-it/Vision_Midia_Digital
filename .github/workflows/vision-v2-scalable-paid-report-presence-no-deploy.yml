name: Vision V2 Scalable Report Archive and Persistent Presence QA NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/economy-guardrails/original-report-archive-bridge.py'
      - 'tests/vision-v2-sequence-qa/economy-guardrails/persistent-presence-qa.py'
      - 'tests/vision-v2-sequence-qa/economy-guardrails/scalable-capacity-policy.cjs'
      - 'tests/vision-v2-sequence-qa/economy-guardrails/scalable-capacity-policy.test.cjs'
      - '.github/workflows/vision-v2-scalable-paid-report-presence-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report-parity:
    name: Original 40-filter 200-group JSON AES-GCM archive PG17
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict credential and branch safety
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          test -z "${PGSERVICE:-}"
          echo 'NO_DEPLOY=1 QA_STREAM_GUARD_GROUP=1 DRAIN_DISABLED=1'
      - run: python -m pip install 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Restore original report JSON from encrypted archives plus 10000 events
        env:
          QA_STREAM_GUARD_GROUP: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/economy-guardrails/original-report-archive-bridge.py | tee qa-report-archive-integrity.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-original-report-archive-restore
          path: qa-report-archive-integrity.log
          retention-days: 14
  presence:
    name: Persistent TCP presence ${{ matrix.tvs }} clients PG17 NO EDGE
    strategy:
      fail-fast: false
      matrix:
        tvs: [10, 100, 300, 600]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict credential and branch safety
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          echo 'NO_DEPLOY=1 QA_STREAM_GUARD_GROUP=1 DRAIN_DISABLED=1'
      - run: python -m pip install 'psycopg[binary]==3.2.6'
      - name: Real persistent local TCP and no per-heartbeat SQL or Edge Function
        env:
          QA_STREAM_GUARD_GROUP: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/economy-guardrails/persistent-presence-qa.py --tvs ${{ matrix.tvs }} | tee qa-presence-${{ matrix.tvs }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-presence-${{ matrix.tvs }}
          path: qa-presence-${{ matrix.tvs }}.log
          retention-days: 14

  paid-plan-policy:
    name: Paid-plan scalable 10/100/300/600/1000 clients ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: ['20','22']
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Strict no-production boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          echo 'NO_DEPLOY=1 QA_STREAM_GUARD_GROUP=1 DRAIN_DISABLED=1'
      - name: Test stable protocol and tier-aware gateway/Realtime budgets
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/vision-v2-sequence-qa/economy-guardrails/scalable-capacity-policy.test.cjs | tee qa-paid-scaling-policy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-paid-scaling-policy-node-${{ matrix.node }}
          path: qa-paid-scaling-policy.log
          retention-days: 14
