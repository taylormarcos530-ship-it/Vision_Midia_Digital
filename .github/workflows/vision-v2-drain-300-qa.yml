name: Vision V2 Bounded Admission Drain PG17 8 12 20 NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/secure-pool-qa/drain_300.py'
      - '.github/workflows/vision-v2-drain-300-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drain:
    name: PG17 300 mixed HTTP cutover commercial drain pool ${{ matrix.pool }} chunk ${{ matrix.chunk }}
    strategy:
      fail-fast: false
      matrix:
        pool: [8,12,20]
        chunk: [65536,262144]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Branch and production keys guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          echo "PG17_SYNTHETIC=true NO_OFFICIAL_SUPABASE=true NO_DEPLOY=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Real 300-client drain switch, 420ms timeout and 503-only retry <=7.5s
        env:
          QA_COMMERCIAL_ADMISSIONS: ${{ matrix.pool }}
          QA_PG_POOL_SIZE: ${{ matrix.pool }}
          QA_COMMERCIAL_CHUNK: ${{ matrix.chunk }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/vision-v2-sequence-qa/secure-pool-qa/drain_300.py
          python -u tests/vision-v2-sequence-qa/secure-pool-qa/drain_300.py
          echo "QA_DRAIN_300_PASS=true"
