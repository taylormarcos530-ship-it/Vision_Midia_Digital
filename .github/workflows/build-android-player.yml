name: Build Vision Player APK

on:
  push:
    branches: [main, fix/android-tv-native-rotation-20261020, fix/android-tv-boot-autostart-1519-20261020, fix/aquario-webview-black-screen-diagnostics-20261026]
    paths:
      - 'android-player/**'
      - 'player.html'
      - 'player.css'
      - 'player.js'
      - 'config.js'
      - 'clock.html'
      - 'news-feed.html'
      - 'news-feed.css'
      - 'news-feed.js'
      - 'icon.svg'
      - 'player.webmanifest'
      - 'sw.js'
      - '.github/workflows/build-android-player.yml'
  pull_request:
    branches: [fix/android-tv-native-rotation-20261020]
  workflow_dispatch:

# This workflow change lives only on the diagnostic branch; uploads remain isolated.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle current web player into APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-player/app/src/main/assets
          cp player.html player.css player.js config.js icon.svg player.webmanifest sw.js clock.html news-feed.html news-feed.css news-feed.js android-player/app/src/main/assets/

      - name: Validate web player JavaScript
        run: node --check player.js

      # Compatibilidade exclusiva do APK de diagnóstico do Aquário.
      # O WebView 78 não interpreta optional chaining/nullish coalescing.
      # Transpilar SOMENTE as cópias dentro de assets; não alterar player.js do site.
      # Builds an independent installation ONLY in CI for the Aquario branch.
      # Source Gradle and production/stable APK configurations stay unchanged.
      - name: Isolate Aquario diagnostic package at build time
        if: github.ref == 'refs/heads/fix/aquario-webview-black-screen-diagnostics-20261026'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          file = Path('android-player/app/build.gradle')
          text = file.read_text(encoding='utf-8')
          old = "        debug {\\n            versionNameSuffix '-preview'\\n        }".replace('\\n', '\n')
          new = "        debug {\\n            applicationIdSuffix '.aquario'\\n            versionNameSuffix '-aquario-diagnostic'\\n            manifestPlaceholders = [playerLabel: 'Vision Player Aquario Teste', setupScheme: 'visionmidia-aquario']\\n        }".replace('\\n', '\n')
          if text.count(old) != 1:
              raise SystemExit('Aborted: unexpected Android debug configuration')
          file.write_text(text.replace(old, new), encoding='utf-8')
          PY
          grep -F "applicationIdSuffix '.aquario'" android-player/app/build.gradle

      - name: Adapt bundled scripts for Aquario WebView 78
        if: github.ref == 'refs/heads/fix/aquario-webview-black-screen-diagnostics-20261026'
        shell: bash
        run: |
          set -euo pipefail
          for file in player.js news-feed.js sw.js; do
            npx --yes esbuild@0.25.5 "android-player/app/src/main/assets/${file}" \
              --target=chrome78 --format=iife --outfile="/tmp/${file}"
            mv "/tmp/${file}" "android-player/app/src/main/assets/${file}"
            node --check "android-player/app/src/main/assets/${file}"
          done

      - name: Build debug APK
        run: gradle -p android-player --no-daemon assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          cp android-player/app/build/outputs/apk/debug/app-debug.apk android-player/app/build/outputs/apk/debug/Vision-Player-preview.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vision-Player-APK
          path: android-player/app/build/outputs/apk/debug/Vision-Player-preview.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Aquario test APK only to its isolated branch
        if: github.ref == 'refs/heads/fix/aquario-webview-black-screen-diagnostics-20261026'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp android-player/app/build/outputs/apk/debug/Vision-Player-preview.apk downloads/Vision-Player-Aquario-Diagnostico.apk
          test -s downloads/Vision-Player-Aquario-Diagnostico.apk
          sha256sum downloads/Vision-Player-Aquario-Diagnostico.apk > downloads/Vision-Player-Aquario-Diagnostico.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Vision-Player-Aquario-Diagnostico.apk downloads/Vision-Player-Aquario-Diagnostico.sha256
          if git diff --cached --quiet; then
            echo 'Diagnostic APK unchanged.'
            exit 0
          fi
          git commit -m 'build(test): publish Aquario diagnostic APK on isolated branch'
          # The web download page may have been updated while the APK was building.
          # Replay this binary-only commit on the latest isolated-branch head.
          git fetch origin fix/aquario-webview-black-screen-diagnostics-20261026
          git rebase origin/fix/aquario-webview-black-screen-diagnostics-20261026
          git push origin HEAD:fix/aquario-webview-black-screen-diagnostics-20261026
