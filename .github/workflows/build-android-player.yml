name: Build Vision Player APK

on:
  push:
    branches: [main]
    paths:
      - 'android-player/**'
      - 'player.html'
      - 'player.css'
      - 'player.js'
      - 'config.js'
      - 'icon.svg'
      - 'player.webmanifest'
      - 'sw.js'
      - '.github/workflows/build-android-player.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle current web player into APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-player/app/src/main/assets
          cp player.html player.css player.js config.js icon.svg player.webmanifest sw.js android-player/app/src/main/assets/

      - name: Validate web player JavaScript
        run: node --check player.js

      - name: Build debug APK
        run: gradle -p android-player --no-daemon assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          cp android-player/app/build/outputs/apk/debug/app-debug.apk android-player/app/build/outputs/apk/debug/Vision-Player-preview.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vision-Player-APK
          path: android-player/app/build/outputs/apk/debug/Vision-Player-preview.apk
          if-no-files-found: error
          retention-days: 14
