name: Vision V2 PG17 Independent FORCE RLS TCP Clocks and Two Proxies NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/causal-two-proxy-qa/adversarial.py'
      - '.github/workflows/vision-v2-causal-independent-adversarial-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  negative:
    name: PG17 independent negative 300 p${{ matrix.pool }} c${{ matrix.chunk }}
    strategy:
      fail-fast: false
      matrix:
        pool: [8,12,20]
        chunk: [65536,262144]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Hard safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          test -z "${PGSERVICE:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: PostgreSQL17 RLS negatives, real HTTP RST halfopen simultaneous revoke
        env:
          QA_POOL: ${{ matrix.pool }}
          QA_CHUNK: ${{ matrix.chunk }}
          QA_STREAM_GUARD_GROUP: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/vision-v2-sequence-qa/causal-two-proxy-qa/{causal,adversarial}.py
          python -u tests/vision-v2-sequence-qa/causal-two-proxy-qa/adversarial.py | tee qa-independent.log
      - name: Save complete independent attempt ledger and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-independent-p${{ matrix.pool }}-c${{ matrix.chunk }}
          path: |
            qa-independent.log
            qa-independent-ledger.json
          if-no-files-found: warn
          retention-days: 14
