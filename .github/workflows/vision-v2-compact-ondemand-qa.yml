name: Vision V2 Compact On-Demand AES Archive 2 Runner PG17 - NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/compact-ondemand-qa/**'
      - '.github/workflows/vision-v2-compact-ondemand-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    name: Runner A — preserve raw, daily-only CQRS, encrypted external segments
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard isolated experimental ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031'
          echo 'NO_SUPABASE=true NO_PRODUCTION_SQL=true NO_MAIN=true NO_DEPLOY=true NO_APK=true NO_PANEL=true NO_TVS=true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Generate synthetic originals, daily CQRS and AES-256-GCM external segments
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/qa_archive" "$RUNNER_TEMP/qa_keys"
          python -u tests/vision-v2-sequence-qa/compact-ondemand-qa/compact.py --mode producer --archive "$RUNNER_TEMP/qa_archive" --key-dir "$RUNNER_TEMP/qa_keys"
      - uses: actions/upload-artifact@v4
        with:
          name: qa-only-encrypted-archive
          path: ${{ runner.temp }}/qa_archive/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: qa-only-synthetic-key-NO-PRODUCTION-KMS
          path: ${{ runner.temp }}/qa_keys/
          retention-days: 1
          if-no-files-found: error
  restore:
    needs: export
    name: Runner B — cold/warm HTTP fetch, temp RPC and 48x JSON/export parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard disposable restore
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031'
          echo 'NO_SUPABASE=true NO_DEPLOY=true NO_APK=true NO_PANEL=true NO_SITE=true NO_TVS=true NO_DELETE_ORIGINALS=true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - uses: actions/download-artifact@v4
        with:
          name: qa-only-encrypted-archive
          path: ${{ runner.temp }}/qa_archive/
      - uses: actions/download-artifact@v4
        with:
          name: qa-only-synthetic-key-NO-PRODUCTION-KMS
          path: ${{ runner.temp }}/qa_keys/
      - name: Verify archive under HTTP failures and original JSON parity from TEMP SQL
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/compact-ondemand-qa/compact.py --mode consumer --archive "$RUNNER_TEMP/qa_archive" --key-dir "$RUNNER_TEMP/qa_keys"
          echo 'QA_V2_COMPACT_ONDEMAND_2_RUNNERS=PASS'
      - name: Preserve all originals
        if: always()
        run: echo 'NO_SQL_ON_PRODUCTION=true NO_DELETE_ORIGINALS=true NO_MAIN=true NO_APK=true'
