name: Vision V2 WSS Independent TOCTOU Negative PG17 NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - '.github/workflows/vision-v2-wss-toctou-negative-independence-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-expected:
    name: Demonstrate security FAIL, pool ${{ matrix.pool }} chunk ${{ matrix.chunk }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pool: 8, chunk: 65536}
          - {pool: 12, chunk: 262144}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert isolated QA branch and no real credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          echo 'NO_DEPLOY=1 QA_STREAM_GUARD_GROUP=1 SECURITY_FAIL_EXPECTED=1'
      - run: python -m pip install 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Run unchanged two-real-process PG17 adversarial gate/route race
        shell: bash
        env:
          QA_POOL: ${{ matrix.pool }}
          QA_CHUNK: ${{ matrix.chunk }}
          QA_STREAM_GUARD_GROUP: '1'
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/multiprocess-causal-qa/controller.py | tee qa-toctou-negative.log
      - name: Explicitly demand real safety FAIL marker, not a false PASS
        shell: bash
        run: |
          python - <<'PY'
          import json
          with open('qa-mproc-ledger.json') as f: data=json.load(f)
          s=data['summary']
          assert s['TOCTOU_gate_closed_but_HTTP200'] is True,s
          assert s['security_verdict']=='FAIL_NO_GO',s
          assert s['TOCTOU_counterexample_status']=='FAIL_REPRODUCED',s
          assert s['production_GO'] is False,s
          print('QA_TOCTOU_NEGATIVE_REPRODUCED=true SECURITY_VERDICT=FAIL_NO_GO')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-wss-toctou-negative-p${{ matrix.pool }}-c${{ matrix.chunk }}
          path: |
            qa-toctou-negative.log
            qa-mproc-ledger.json
          retention-days: 14
