name: Vision backup foundation security checks (no production access)
on:
  push:
    branches:
      - fix/vision-backup-foundation-isolated-20261026
    paths:
      - scripts/vision-backup/backup.py
      - tests/test_vision_backup_safety.py
      - docs/VISION_PROTECAO_ETAPA_1_BACKUP.md
      - .github/workflows/vision-backup-safety-isolated.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile scripts/vision-backup/backup.py tests/test_vision_backup_safety.py
      - name: Security unit tests (mocked; no database access)
        run: python -m unittest discover -s tests -p 'test_vision_backup_safety.py' -v
      - name: Confirm script only documents invocation with required opt-in
        run: python scripts/vision-backup/backup.py --help
