name: Vision V30 playback quarantine isolated QA
on:
  push:
    branches:
      - fix/playback-daily-retention-safe-20261030
    paths:
      - 'player.js'
      - 'tests/v30-playback-quarantine.test.cjs'
      - 'tests/v30-playback-storage-quota.test.cjs'
      - 'tests/v30-gateway-v22-parity.test.cjs'
      - 'tests/v30-bundle-v3-traffic.test.cjs'
      - 'supabase/functions/device-bundle-stable/index.ts'
      - 'supabase/functions/device-gateway/index.ts'
      - '.github/workflows/playback-v30-quarantine-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-queue-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real Player queue in sandbox without network or Supabase
        run: |
          node --test tests/v30-playback-quarantine.test.cjs tests/v30-playback-storage-quota.test.cjs
          node --test tests/v30-gateway-v22-parity.test.cjs
          node --test tests/v30-bundle-v3-traffic.test.cjs
          node --test tests/v30-playback-gateway-ack.test.cjs
