name: Patch TV Replacement UI
on:
  push:
    branches: [stage-signage-v2]
    paths:
      - '.github/patch_replace_tv.py'
      - '.github/workflows/patch-replace-tv.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-signage-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/patch_replace_tv.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check master.js
      - name: Validate markers
        run: |
          grep -q 'replace-device-dialog' index.html
          grep -q 'master-replace-device-dialog' master.html
          grep -q 'retired_at=is.null' app.js
          grep -q 'data-replace-device' app.js
          grep -q 'data-replace-company-device' master.js
          grep -q "is('retired_at',null)" supabase/functions/master-admin/index.ts
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html master.js master.html supabase/functions/master-admin/index.ts
          git diff --cached --quiet || git commit -m 'feat: add atomic TV replacement to client and Master'
          git push
