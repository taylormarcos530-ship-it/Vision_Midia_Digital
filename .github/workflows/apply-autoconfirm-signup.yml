name: Apply Auto-confirm Signup Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-autoconfirm-signup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch client signup only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app.js')
          text = p.read_text()
          pattern = r"  async function handleSignup\(event\) \{.*?\n  \}\n\n  function friendlyAuthError"
          replacement = '''  async function handleSignup(event) {
            event.preventDefault();
            const button = $('#signup-submit');
            const email = $('#signup-email').value.trim();
            const password = $('#signup-password').value;
            const displayName = $('#signup-name').value.trim();
            setBusy(button, true, 'Criando conta...');
            try {
              await functionRequest('public-signup', {
                authenticated: false,
                body: { email, password, display_name: displayName },
              });
              const data = await authRequest('/token?grant_type=password', {
                body: { email, password },
              });
              if (!data?.access_token) throw new Error('Login não retornou uma sessão válida.');
              saveSession(data);
              await enterAuthenticatedApp();
              toast('Conta criada', 'Seu acesso já está liberado. Agora crie sua empresa.');
            } catch (error) {
              toast('Não foi possível criar a conta', friendlyAuthError(error), 'error');
            } finally { setBusy(button, false); }
          }

          function friendlyAuthError'''
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'handleSignup replacement count={count}')
          new_text = new_text.replace("    if (/email not confirmed/i.test(msg)) return 'Confirme seu e-mail antes de entrar.';", "    if (/email not confirmed/i.test(msg)) return 'Esta conta antiga ainda não está liberada. Crie uma nova conta ou fale com o administrador.';")
          new_text = new_text.replace("    if (/user already registered/i.test(msg)) return 'Este e-mail já está cadastrado.';", "    if (/email_already_registered|user already registered/i.test(msg)) return 'Este e-mail já está cadastrado.';\n    if (/signup_rate_limited/i.test(msg)) return 'Muitas tentativas de cadastro. Aguarde alguns minutos e tente novamente.';\n    if (/invalid_email/i.test(msg)) return 'Informe um e-mail válido.';\n    if (/invalid_password/i.test(msg)) return 'A senha deve ter entre 8 e 72 caracteres.';\n    if (/invalid_display_name/i.test(msg)) return 'Informe seu nome.';")
          p.write_text(new_text)
          PY

          node --check app.js
          if grep -n "Enviamos a confirmação para concluir o cadastro" app.js; then
            echo 'Old email-confirmation signup branch still present' >&2
            exit 1
          fi

      - name: Add Edge Function source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/functions/public-signup
          cat > supabase/functions/public-signup/index.ts <<'EOF'
          import { createClient } from 'npm:@supabase/supabase-js@2'

          const CORS = {
            'Access-Control-Allow-Origin': '*',
            'Access-Control-Allow-Headers': 'authorization, apikey, content-type',
            'Access-Control-Allow-Methods': 'POST, OPTIONS',
          }

          const json = (data: unknown, status = 200) => new Response(JSON.stringify(data), {
            status,
            headers: { ...CORS, 'Content-Type': 'application/json', 'Cache-Control': 'no-store' },
          })

          const clean = (value: unknown, max = 160) => String(value ?? '').trim().slice(0, max)

          async function sha256(value: string) {
            const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(value))
            return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('')
          }

          function adminClient() {
            const secret = JSON.parse(Deno.env.get('SUPABASE_SECRET_KEYS') || '{}').default || Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')
            const url = Deno.env.get('SUPABASE_URL') || ''
            if (!secret || !url) throw new Error('backend_keys_unavailable')
            return createClient(url, secret, { auth: { persistSession: false, autoRefreshToken: false } })
          }

          Deno.serve(async (req) => {
            if (req.method === 'OPTIONS') return new Response('ok', { headers: CORS })
            if (req.method !== 'POST') return json({ error: 'method_not_allowed' }, 405)

            try {
              const body = await req.json().catch(() => ({}))
              const email = clean(body.email, 320).toLowerCase()
              const password = String(body.password ?? '')
              const displayName = clean(body.display_name, 120)

              if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return json({ error: 'invalid_email' }, 400)
              if (password.length < 8 || password.length > 72) return json({ error: 'invalid_password' }, 400)
              if (displayName.length < 2) return json({ error: 'invalid_display_name' }, 400)

              const forwarded = req.headers.get('cf-connecting-ip') || req.headers.get('x-forwarded-for') || 'unknown'
              const source = forwarded.split(',')[0].trim().slice(0, 120)
              const sourceHash = await sha256(`vision-signup:${source}`)
              const emailHash = await sha256(`vision-signup:${email}`)
              const admin = adminClient()
              const attempts = admin.schema('private').from('public_signup_attempts')

              const tenMinutesAgo = new Date(Date.now() - 10 * 60 * 1000).toISOString()
              const oneHourAgo = new Date(Date.now() - 60 * 60 * 1000).toISOString()

              const [{ count: sourceCount, error: sourceError }, { count: emailCount, error: emailError }] = await Promise.all([
                attempts.select('id', { count: 'exact', head: true }).eq('source_hash', sourceHash).gte('attempted_at', tenMinutesAgo),
                attempts.select('id', { count: 'exact', head: true }).eq('email_hash', emailHash).gte('attempted_at', oneHourAgo),
              ])
              if (sourceError) throw sourceError
              if (emailError) throw emailError
              if ((sourceCount || 0) >= 5 || (emailCount || 0) >= 5) return json({ error: 'signup_rate_limited' }, 429)

              const { data: attempt, error: attemptError } = await attempts
                .insert({ source_hash: sourceHash, email_hash: emailHash, success: false })
                .select('id')
                .single()
              if (attemptError) throw attemptError

              const { data, error } = await admin.auth.admin.createUser({
                email,
                password,
                email_confirm: true,
                user_metadata: { display_name: displayName },
              })

              if (error) {
                const msg = String(error.message || '')
                if (/already|registered|exists/i.test(msg)) return json({ error: 'email_already_registered' }, 409)
                console.error('public-signup createUser', { status: error.status, code: error.code })
                return json({ error: 'signup_failed' }, Number(error.status) || 400)
              }

              await attempts.update({ success: true }).eq('id', attempt.id)
              await attempts.delete().lt('attempted_at', new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString()).catch(() => null)

              return json({ ok: true, user_id: data.user?.id || null }, 201)
            } catch (error) {
              console.error('public-signup', error)
              return json({ error: 'internal_error' }, 500)
            }
          })
          EOF

      - name: Add migration source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/migrations
          cat > supabase/migrations/20260908160126_add_public_signup_rate_limits.sql <<'EOF'
          create table if not exists private.public_signup_attempts (
            id bigint generated always as identity primary key,
            source_hash text not null check (char_length(source_hash) = 64),
            email_hash text not null check (char_length(email_hash) = 64),
            attempted_at timestamptz not null default now(),
            success boolean not null default false
          );

          create index if not exists public_signup_attempts_source_time_idx
            on private.public_signup_attempts (source_hash, attempted_at desc);
          create index if not exists public_signup_attempts_email_time_idx
            on private.public_signup_attempts (email_hash, attempted_at desc);

          alter table private.public_signup_attempts enable row level security;
          revoke all on table private.public_signup_attempts from public, anon, authenticated;
          revoke all on sequence private.public_signup_attempts_id_seq from public, anon, authenticated;

          comment on table private.public_signup_attempts is 'Backend-only rate limiting audit for public auto-confirmed signup.';
          EOF

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'taylormarcos530-ship-it'
          git config user.email 'taylormarcos530@gmail.com'
          git add app.js supabase/functions/public-signup/index.ts supabase/migrations/20260908160126_add_public_signup_rate_limits.sql
          git diff --cached --check
          git commit -m 'feat: create accounts without email confirmation'
          git push origin HEAD:main
