name: Vision V2 PG17 Bounded Chunk Fence Revocation Replay Stress QA NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/bounded-fence-qa/**'
      - '.github/workflows/vision-v2-bounded-stream-fence-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-fence:
    name: PG17 two OS-process HTTP full gzip 100-300 bounded lock commit ordering and stall timeout
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert isolated branch and no production credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          echo "DISPOSABLE_PG17=true NO_PROD=true NO_DEPLOY=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Validate QA syntax
        run: python -m py_compile tests/vision-v2-sequence-qa/bounded-fence-qa/qa.py
      - name: Verify per-chunk advisory lock covers socket write, bounded intentional stalls, 100-300 full JSON across cutover and rollback
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/bounded-fence-qa/qa.py
          echo "QA_BOUNDED_FENCE_PASS=true"
      - name: Scope
        if: always()
        run: echo "NO_SUPABASE=true NO_APK=true NO_PANEL=true NO_SITE=true NO_TV=true NO_REAL_HISTORY=true"
  ordered-replay:
    name: Durable outbox restart/crash at transaction checkpoint and silent event invalidation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Production secret guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Validate durable PG17 outbox and PostgreSQL TCP refusal
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/ordered-replay-fence-qa/qa.py
          echo "QA_REPLAY_RESTART_PASS=true"
  commercial-race:
    name: Concurrent multi-publisher and two consumer live HTTP commercial replay and unsafe revocation negative
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
