      - name: Syntax
        run: python -m py_compile tests/vision-v2-sequence-qa/bounded-fence-qa/crash_matrix.py
      - name: Verify committed producer and three interrupted subscriber boundaries with persistent exact-once receipts
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/bounded-fence-qa/crash_matrix.py
          echo "QA_CRASH_MATRIX_PASS=true"
      - name: Safety scope
        if: always()
        run: echo "NO_PRODUCTION=true NO_APK=true NO_DEPLOY=true NO_SUPABASE=true"
