name: Vision V2 PG17 100-300 ACTUAL Advisory Lock Holders NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-toctou-continuous-guard-qa-20261102
    paths:
      - 'tests/vision-v2-sequence-qa/pg-lock-storm-qa/**'
      - '.github/workflows/vision-v2-pg17-100-300-real-lock-holders-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-lock-holders:
    name: PG17 ${{ matrix.tvs }} real backend locks / ${{ matrix.chunk }} block metadata
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tvs: 100, chunk: 65536}
          - {tvs: 100, chunk: 262144}
          - {tvs: 300, chunk: 65536}
          - {tvs: 300, chunk: 262144}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Forbid production credentials and foreign branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-toctou-continuous-guard-qa-20261102
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          test -z "${PGSERVICE:-}"
          test -z "${REDIS_URL:-}"
          echo 'NO_DEPLOY=1 QA_STREAM_GUARD_GROUP=1 DRAIN_DISABLED=1'
      - name: Reconfigure ONLY disposable PostgreSQL17 service to 450 max backends
        env:
          QA_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test ${#QA_PG_CONTAINER} -ge 12
          docker exec "$QA_PG_CONTAINER" psql -U postgres -d vision_v2_quarantine_disposable \
            -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET max_connections = 450"
          docker restart "$QA_PG_CONTAINER"
          for i in $(seq 1 60); do
            if docker exec "$QA_PG_CONTAINER" pg_isready -U postgres -d vision_v2_quarantine_disposable >/dev/null 2>&1; then
              test "$(docker exec "$QA_PG_CONTAINER" psql -U postgres -d vision_v2_quarantine_disposable -Atc 'SHOW max_connections')" = "450"
              echo 'QA_REAL_PG_BACKENDS_MAX=450'
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: python -m pip install 'psycopg[binary]==3.2.6'
      - name: Parse isolated PG session workers and controller
        run: |
          python -m py_compile tests/vision-v2-sequence-qa/pg-lock-storm-qa/holder.py
          python -m py_compile tests/vision-v2-sequence-qa/pg-lock-storm-qa/controller.py
      - name: Reproduce 750ms starvation and independently test process SIGKILL
        env:
          QA_TVS: ${{ matrix.tvs }}
          QA_POOL: '12'
          QA_CHUNK: ${{ matrix.chunk }}
          QA_STREAM_GUARD_GROUP: '1'
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/pg-lock-storm-qa/controller.py \
            | tee qa-v2-actual-locks.log
      - name: CI PASS means negative security proof reproduced, NOT release authorization
        run: |
          python - <<'PY'
          import json
          d=json.load(open('qa-v2-real-pg-locks.json'))
          assert d['production_GO'] is False
          assert d['PG_metrics']['before']['granted']==d['holders_requested']
          assert d['PG_metrics']['before']['distinct']==d['holders_requested']
          assert d['unbounded_300_lock_holders']['gate_still_open']
          assert d['unbounded_300_lock_holders']['writer']['committed'] is False
          assert d['emergency_SIGKILL_both_holder_processes']['writer']['committed']
          assert d['emergency_SIGKILL_both_holder_processes']['later_shared_readers_rejected']==20
          assert d['security_verdict']=='FAIL_NO_GO_BOUNDED_REVOCATION'
          print('REAL_PG_LOCK_HOLDER_TEST_PASS=true STALLED_REVOCATION_SECURITY_FAIL=true NO_GO=1')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg17-real-locks-${{ matrix.tvs }}-${{ matrix.chunk }}
          path: |
            qa-v2-actual-locks.log
            qa-v2-real-pg-locks.json
          retention-days: 14
