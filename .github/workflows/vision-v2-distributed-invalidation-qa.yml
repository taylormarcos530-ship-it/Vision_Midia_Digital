name: Vision V2 PG17 2 Replicas Invalidation JWT Revocation QA - NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/distributed-invalidation-qa/**'
      - '.github/workflows/vision-v2-distributed-invalidation-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  producer:
    name: Runner A disposable PG17 synthetic original RPC baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce isolated branch and no production service
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          echo "NO_SUPABASE=true NO_DEPLOY=true NO_APK=true NO_PANEL=true NO_SITE=true NO_TV=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Create synthetic encrypted archive and full original RPC expected JSON
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/qa_archive" "$RUNNER_TEMP/qa_keys"
          python -u tests/vision-v2-sequence-qa/compact-ondemand-qa/compact.py --mode producer --archive "$RUNNER_TEMP/qa_archive" --key-dir "$RUNNER_TEMP/qa_keys"
      - uses: actions/upload-artifact@v4
        with:
          name: distributed-qa-synthetic-archive
          path: ${{ runner.temp }}/qa_archive/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: distributed-qa-synthetic-key-not-kms
          path: ${{ runner.temp }}/qa_keys/
          retention-days: 1
          if-no-files-found: error
  replicas:
    needs: producer
    name: Runner B two independent PG17 LISTEN subscribers 110K 512K 2M and 100-300 HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce QA only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          echo "NO_PROD_ACCESS=true NO_DEPLOY=true NO_SUPABASE_SQL=true NO_SECRETS=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - uses: actions/download-artifact@v4
        with:
          name: distributed-qa-synthetic-archive
          path: ${{ runner.temp }}/qa_archive/
      - uses: actions/download-artifact@v4
        with:
          name: distributed-qa-synthetic-key-not-kms
          path: ${{ runner.temp }}/qa_keys/
      - name: Run two-replica revision revocation TTL RLS HTTP 100 300 matrix
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/distributed-invalidation-qa/qa.py --archive "$RUNNER_TEMP/qa_archive" --key-dir "$RUNNER_TEMP/qa_keys"
          echo "QA_DISTRIBUTED_TWO_REPLICA_PASS=true"
      - name: Final production guard
        if: always()
        run: echo "NO_SUPABASE=true NO_APK=true NO_PANEL=true NO_SITE=true NO_TVS=true NO_ORIGINAL_DELETE=true"
