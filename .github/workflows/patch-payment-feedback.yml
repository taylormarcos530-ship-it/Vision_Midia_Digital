name: Patch Payment And Save Feedback
on:
  push:
    branches: [main]
    paths:
      - '.github/patch_payment_feedback.py'
      - '.github/workflows/patch-payment-feedback.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patch_payment_feedback.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check master.js
      - name: Validate markers
        run: |
          grep -q 'access-payment' index.html
          grep -q 'me-payment-url' master.html
          grep -q 'savePaymentUrlRequest' master.js
          grep -q 'Confirmar pagamento e liberar' master.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html master.js master.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: add payment link and standard save feedback'
          git push origin main
