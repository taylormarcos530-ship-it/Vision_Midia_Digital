name: Vision V2 PostgreSQL17 Disposable Economics Rows and WAL NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/economy-guardrails/pg17_storage.py'
      - '.github/workflows/vision-v2-supabase-free-pg17-storage-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  economy-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard branch and refuse real project credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          echo 'NO_DEPLOY=1 QA_STREAM_GUARD_GROUP=1 DRAIN_DISABLED=1'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6'
      - name: Measure 300k physical rows plus 100 and 300 concurrent writers in PG17
        env:
          QA_STREAM_GUARD_GROUP: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/economy-guardrails/pg17_storage.py | tee qa-economy-pg17.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-economy-pg17-real-local-measurements
          path: qa-economy-pg17.log
          retention-days: 14
