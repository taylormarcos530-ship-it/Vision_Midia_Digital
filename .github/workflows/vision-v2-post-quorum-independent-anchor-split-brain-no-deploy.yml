name: Vision V2 Post Quorum Independent Anchor Split Brain Regression No Deploy
on:
  push:
    branches:
      - experiment/vision-v2-toctou-continuous-guard-qa-20261102
    paths:
      - 'tests/vision-v2-sequence-qa/redis-wss-fault-qa/external-anchor-real-restore.py'
      - 'tests/vision-v2-sequence-qa/redis-wss-fault-qa/anchor-jti-worker.py'
      - '.github/workflows/vision-v2-post-quorum-independent-anchor-split-brain-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  witness-adversarial:
    name: 4 PG17 containers 2 OS auth workers 1 canonical anchor and Redis7 x2
    runs-on: ubuntu-latest
    timeout-minutes: 24
    services:
      postgres_main:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      postgres_witness:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_witness_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-witness-password
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_witness_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      postgres_shadow:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_witness_shadow_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-shadow-password
        ports: [5435:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_witness_shadow_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      postgres_anchor:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_anchor_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-anchor-password
        ports: [5436:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_anchor_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis_primary:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis_secondary:
        image: redis:7.4-alpine
        ports: [6380:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse official credentials and foreign branches
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-toctou-continuous-guard-qa-20261102
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          test -z "${PGSERVICE:-}"
          test -z "${REDIS_URL:-}"
          echo 'NO_DEPLOY=1 QA_STREAM_GUARD_GROUP=1 DRAIN_DISABLED=1'
      - run: python -m pip install 'psycopg[binary,pool]==3.2.6' 'redis==5.2.1' 'websockets==14.2'
      - name: Ephemeral localhost TLS only
        run: |
          set -euo pipefail
          mkdir -p qa-restore-certs
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout qa-restore-certs/local.key -out qa-restore-certs/local.pem \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          chmod 600 qa-restore-certs/local.key
      - name: Syntax and separate PG17/Redis service checks
        run: |
          python -m py_compile tests/vision-v2-sequence-qa/redis-wss-fault-qa/external-anchor-real-restore.py
          python -m py_compile tests/vision-v2-sequence-qa/redis-wss-fault-qa/anchor-jti-worker.py
      - name: Real dual mirror pg_restore with JTI anchor preserved then restored and split anchors
        env:
          QA_STREAM_GUARD_GROUP: '1'
          QA_CERT: qa-restore-certs/local.pem
          QA_KEY: qa-restore-certs/local.key
          QA_PRIMARY_CONTAINER: ${{ job.services.postgres_witness.id }}
          QA_SECONDARY_CONTAINER: ${{ job.services.postgres_shadow.id }}
          QA_ANCHOR_CONTAINER: ${{ job.services.postgres_anchor.id }}
          QA_REDIS_PRIMARY_CONTAINER: ${{ job.services.redis_primary.id }}
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/redis-wss-fault-qa/external-anchor-real-restore.py | tee qa-external-anchor.log
      - name: Verify local anchor resilience, explicit full rollback and split-brain SECURITY FAIL
        run: |
          python - <<'PY'
          import json
          x=json.load(open('qa-v2-external-anchor.json'))
          assert x['production_GO'] is False
          assert x['shared_one_external_anchor']['one_JTI_accepted']
          assert x['owner_source_of_truth']['wrong_company_denied']
          assert x['both_authority_PG17_logically_restored']['previous_JTI_rejected_by_separate_anchor']
          assert x['anchor_real_container_stop_restart']['no_login_if_canonical_anchor_down']
          assert x['ALL_local_and_global_authority_restored']['old_signed_JTI_accepted_after_anchor_restore']
          assert x['two_uncoordinated_external_anchors']['same_JTI_accepted_by_both']
          assert x['security_verdict']=='NO_GO_FULL_RESTORE_AND_SPLIT_BRAIN_REMAIN_UNSAFE'
          print('NEGATIVE_PROOFS_PASS=true SECURITY_FAIL=true PRODUCTION_NO_GO=1')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg17-jti-owner-external-anchor-negative-recovery
          path: |
            qa-external-anchor.log
            qa-v2-external-anchor.json
          retention-days: 14
