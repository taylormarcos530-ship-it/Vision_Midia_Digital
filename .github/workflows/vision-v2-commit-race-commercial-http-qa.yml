name: Vision V2 PG17 Concurrent Commit Race HTTP and 300 Cutover AES QA NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/commit-race-http-qa/**'
      - '.github/workflows/vision-v2-commit-race-commercial-http-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-race:
    name: Nine concurrent writers, hard crash after PG commit, actual full HTTP commercial invalidation, socket revocation race
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict branch, env and no deployment guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          echo "PG17_DISPOSABLE=true NO_PRODUCTION=true NO_DEPLOY=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Syntax
        run: python -m py_compile tests/vision-v2-sequence-qa/commit-race-http-qa/qa.py
      - name: Synthetic commercial HTTP revision and auth-write gap negative QA
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/commit-race-http-qa/qa.py
          echo "QA_COMMIT_RACE_PASS=true"
      - name: Report scope
        if: always()
        run: echo "NO_PRODUCTION=true NO_SUPABASE=true NO_APK=true NO_PANEL=true NO_SITE=true NO_TV=true NO_HISTORY=true"
  cutover-300:
    name: 100/300 full gzip HTTP across cutover and 80+ post-rollback assignments
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Production environment isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Baseline complete original gzip JSON 100/300 across cutover rollback with revocation
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/rolling-cutover-outbox-qa/qa.py
          echo "QA_CUTOVER_300_PASS=true"
  remote-aes:
    name: Real ephemeral PG17 remote simulated AES object crash and cold 100/300 HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Production environment isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Revalidate outbox encrypted manifest, force kill, full cold JSON HTTP 100 and 300
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/cold-remote-qa/qa.py
          echo "QA_REMOTE_AES_PASS=true"
