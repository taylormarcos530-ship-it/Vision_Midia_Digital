name: Vision V2 Existing Drain Independent PG17 300 Audit NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - '.github/workflows/vision-v2-drain-priority-pg17-independent-audit-20261102.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: PG17 300 ${{ matrix.mode }} pool ${{ matrix.pool }} chunk ${{ matrix.chunk }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, drain, transport]
        pool: [8, 12, 20]
        chunk: [65536, 262144]
        include:
          - {mode: faults, pool: 12, chunk: 65536}
          - {mode: faults, pool: 12, chunk: 262144}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse official connections, deploy and nonexperimental branches
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          test -z "${PGSERVICE:-}"
          echo "QA_DISPOSABLE_POSTGRES_ONLY=true NO_DEPLOY=true NO_PROD=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Real PG17 300 client benchmark or fault test
        shell: bash
        env:
          QA_MODE: ${{ matrix.mode }}
          QA_N: '300'
          QA_POOL_SIZE: ${{ matrix.pool }}
          QA_PG_POOL_SIZE: ${{ matrix.pool }}
          QA_COMMERCIAL_ADMISSIONS: ${{ matrix.pool }}
          QA_CHUNK: ${{ matrix.chunk }}
          QA_COMMERCIAL_CHUNK: ${{ matrix.chunk }}
          QA_STREAM_GUARD_GROUP: '1'
        run: |
          set -euo pipefail
          python -m py_compile tests/vision-v2-sequence-qa/secure-pool-qa/drain_300.py
          if [ "$QA_MODE" = baseline ]; then
            python -u tests/vision-v2-sequence-qa/secure-pool-qa/mixed_300.py | tee vision-v2-drain-audit.log
          elif [ "$QA_MODE" = drain ]; then
            python -u tests/vision-v2-sequence-qa/secure-pool-qa/drain_300.py | tee vision-v2-drain-audit.log
          elif [ "$QA_MODE" = transport ]; then
            python -u tests/vision-v2-sequence-qa/secure-pool-qa/multiprocess_socket_fence_qa.py | tee vision-v2-drain-audit.log
          elif [ "$QA_MODE" = faults ]; then
            python -u tests/vision-v2-sequence-qa/secure-pool-qa/faults.py | tee vision-v2-drain-audit.log
          else
            echo "UNKNOWN_QA_MODE"; exit 1
          fi
      - name: Preserve original PASS and FAIL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg17-audit-${{ matrix.mode }}-p${{ matrix.pool }}-c${{ matrix.chunk }}
          path: vision-v2-drain-audit.log
          if-no-files-found: warn
          retention-days: 14
