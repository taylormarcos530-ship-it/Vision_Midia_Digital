name: Vision V2 Two Revokers DB Pool 300 Slow 64 256 and AES QA NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/bounded-fence-qa/multi_revokers_pool.py'
      - '.github/workflows/vision-v2-competing-revokers-pool-64-256-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  competing-revokers:
    name: Concurrent revokers and 12-connection pool with 300 slow streams, ${{ matrix.chunk }}
    strategy:
      fail-fast: false
      matrix:
        chunk: [65536, 262144]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact QA ref, no official production access
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          echo "NO_SUPABASE=true NO_DEPLOY=true NO_TVS=true PG17_EPHEMERAL=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned synthetic test libraries
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Security, fairness and live kernel socket backpressure
        env:
          QA_POOL_CHUNK_BYTES: ${{ matrix.chunk }}
        run: |
          set -euo pipefail
          python -m py_compile tests/vision-v2-sequence-qa/bounded-fence-qa/multi_revokers_pool.py
          python -u tests/vision-v2-sequence-qa/bounded-fence-qa/multi_revokers_pool.py
          echo "QA_MULTI_REVOKERS_PASS=true"
  full-http:
    name: Full report 100/300 gzip cutover rollback, bounded block transaction, ${{ matrix.chunk }}
