name: Build Permanent Vision Player Preview APK

on:
  push:
    branches:
      - main
      - fix/saas-media-playlist-device-controls
    paths:
      - 'android-player/**'
      - 'player.html'
      - 'player.css'
      - 'player.js'
      - 'config.js'
      - 'icon.svg'
      - 'player.webmanifest'
      - 'sw.js'
      - '.github/workflows/build-permanent-apk-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record preview source
        shell: bash
        run: |
          set -euo pipefail
          echo "Building ref: $GITHUB_REF"
          echo "Building commit: $GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle current web player into APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-player/app/src/main/assets
          cp player.html player.css player.js config.js icon.svg player.webmanifest sw.js android-player/app/src/main/assets/

      - name: Validate player JavaScript
        run: node --check player.js

      - name: Build installable preview APK
        run: gradle -p android-player --no-daemon assembleDebug

      - name: Copy APK to permanent download path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp android-player/app/build/outputs/apk/debug/app-debug.apk downloads/Vision-Player-preview.apk
          test -s downloads/Vision-Player-preview.apk
          sha256sum downloads/Vision-Player-preview.apk > downloads/Vision-Player-preview.sha256

      - name: Record Player source fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          files = ['player.html','player.css','player.js','config.js','icon.svg','player.webmanifest','sw.js']
          payload = ''.join(f"{name}\n{Path(name).read_text()}\n" for name in files)
          data = {
              'source_sha256': hashlib.sha256(payload.encode()).hexdigest(),
              'git_sha': os.environ.get('GITHUB_SHA', ''),
              'files': files,
          }
          Path('downloads/Vision-Player-preview.source.json').write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vision-Player-preview
          path: |
            downloads/Vision-Player-preview.apk
            downloads/Vision-Player-preview.sha256
            downloads/Vision-Player-preview.source.json
          retention-days: 30

      - name: Commit permanent preview APK to triggering branch
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Vision-Player-preview.apk downloads/Vision-Player-preview.sha256 downloads/Vision-Player-preview.source.json
          if git diff --cached --quiet; then
            echo 'APK already up to date.'
            exit 0
          fi
          git commit -m 'build: add permanent Vision Player preview APK'
          git push origin "HEAD:$GITHUB_REF_NAME"
