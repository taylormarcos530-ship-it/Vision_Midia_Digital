name: Vision V2 PG17 100-300 Concurrent Slow TCP Reader Storm NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-toctou-continuous-guard-qa-20261102
    paths:
      - 'tests/vision-v2-sequence-qa/block-fence-storm-qa/**'
      - '.github/workflows/vision-v2-block-fence-100-300-slow-storm-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storm:
    name: PG17 2 OS proxies ${{ matrix.tvs }} simultaneous TCP readers ${{ matrix.chunk }} block
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tvs: 100, chunk: 65536}
          - {tvs: 100, chunk: 262144}
          - {tvs: 300, chunk: 65536}
          - {tvs: 300, chunk: 262144}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hard reject official infrastructure credentials
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-toctou-continuous-guard-qa-20261102
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          test -z "${PGSERVICE:-}"
          test -z "${REDIS_URL:-}"
          echo 'LOCAL_ONLY=1 NO_DEPLOY=1 QA_STREAM_GUARD_GROUP=1 DRAIN_DISABLED=1'
      - run: python -m pip install 'psycopg[binary]==3.2.6'
      - name: Compile immutable source and new adversarial test
        run: |
          python -m py_compile tests/vision-v2-sequence-qa/block-fence-qa/worker.py
          python -m py_compile tests/vision-v2-sequence-qa/block-fence-storm-qa/storm.py
      - name: Run actual 100/300 connected slow socket QA, fail on deadline or invalid state
        env:
          QA_STREAM_GUARD_GROUP: '1'
          QA_TVS: ${{ matrix.tvs }}
          QA_POOL: '12'
          QA_CHUNK: ${{ matrix.chunk }}
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/block-fence-storm-qa/storm.py | tee qa-v2-storm.log
      - name: Never convert an observed vulnerability into production PASS
        run: |
          python - <<'PY'
          import json
          x=json.load(open('qa-v2-300-storm.json'))
          assert x['production_GO'] is False
          assert x['clients'] in (100,300)
          assert len(x['cases'])==2
          assert all(c['simultaneous_open_clients']==x['clients'] for c in x['cases'])
          assert all(c['within_750ms'] for c in x['cases'])
          assert x['cases'][0]['complete_report_count_after_commit']==0
          assert x['cases'][0]['worker_counts_delta']['application_write_completed_bytes']==0
          assert x['no_claim_all_connections_held_PG_lock_simultaneously']
          print('STORM_LOCAL_TEST_PASS=true PHYSICAL_NETWORK_SLA_UNPROVEN=true PRODUCTION_NO_GO=1')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg17-storm-t${{ matrix.tvs }}-c${{ matrix.chunk }}
          path: |
            qa-v2-storm.log
            qa-v2-300-storm.json
          retention-days: 14
