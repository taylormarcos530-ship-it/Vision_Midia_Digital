name: Vision V2 Encrypted Archive Replay QA - NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/archive-replay-qa/**'
      - '.github/workflows/vision-v2-archive-replay-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 18
    env:
      VISION_V2_QA_POSTGRES_DSN: postgresql://postgres:qa-only-local-password@127.0.0.1:5432/vision_v2_quarantine_disposable
      VISION_V2_QA_ARCHIVE_KEY_HEX: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout only isolated experimental branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert no production or deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031"
          echo "NO_SUPABASE=true NO_APK=true NO_DEPLOY=true NO_TVS=true NO_PRODUCTION_SECRETS=true"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test-only cryptography and PostgreSQL driver
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography==44.0.3' 'psycopg[binary]==3.2.6'
      - name: Initialize guarded disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          root=Path("tests/vision-v2-sequence-qa")
          with psycopg.connect(os.environ["VISION_V2_QA_POSTGRES_DSN"]) as con:
              assert con.execute("SELECT current_database()").fetchone()[0]=="vision_v2_quarantine_disposable"
              con.execute((root/"quarantine-qa/schema.sql").read_text())
              con.execute((root/"archive-replay-qa/archive_schema.sql").read_text())
              print("DISPOSABLE_PG17_AND_RESTRICTED_ROLE=PASS")
          PY
      - name: Archive-only encrypted replay tests (no original SELECT privilege)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/vision-v2-sequence-qa/archive-replay-qa -p 'test_*.py' -v
          echo "ENCRYPTED_ARCHIVE_REPLAY=PASS"
      - name: Assert no release artifacts
        run: echo "NO_DEPLOY=true NO_SUPABASE=true NO_ORIGINAL_DELETION=true"
