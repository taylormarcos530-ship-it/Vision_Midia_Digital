name: Vision V2 100-300 Concurrent AES Archive HTTP CQRS QA - NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/concurrent-archive-http-qa/**'
      - '.github/workflows/vision-v2-concurrent-archive-http-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concurrent-http:
    name: PG17 isolated 100/300 full RPC over HTTP with tenant cache quota and TTL
    runs-on: ubuntu-latest
    timeout-minutes: 24
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard experimental branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031'
          echo 'POSTGRES17_DISPOSABLE=true NO_SUPABASE=true NO_PRODUCTION_SQL=true'
          echo 'NO_MAIN=true NO_APK=true NO_PANEL=true NO_VERCEL=true NO_TVS=true NO_DELETE=true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: QA-only dependencies
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: 100 then 300 concurrent full JSON/export HTTP plus tenant TTL quota QA
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/concurrent-archive-http-qa/qa.py
          echo 'VISION_V2_100_300_CONCURRENT_ARCHIVE_HTTP=PASS'
      - name: No deployment or deletion
        if: always()
        run: echo 'NO_PRODUCTION=true NO_APK=true NO_SITE=true NO_PANEL=true NO_TV=true NO_DELETE_ORIGINALS=true'
