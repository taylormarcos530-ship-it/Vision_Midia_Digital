name: Final cleanup Signage V2

on:
  push:
    branches: [stage-signage-v2]
    paths:
      - '.github/workflows/final-cleanup-signage-v2.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-signage-v2
      - name: Fix notification compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="if (Notification?.permission === 'granted') notifyAccessState(reason);"
          new="if ('Notification' in window && Notification.permission === 'granted') notifyAccessState(reason);"
          if old not in s:
              raise SystemExit('notification guard marker missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check app.js
          node --check master.js
          node --check player.js
      - name: Remove temporary patch/build files
        run: |
          rm -f .github/scripts/finalize_signage_v2.py
          rm -f .github/workflows/finalize-signage-v2.yml
          rm -f .github/workflows/build-vision-player-v14.yml
          rm -f .github/workflows/final-cleanup-signage-v2.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: finalize signage v2 cleanup'
          git push origin HEAD:stage-signage-v2
