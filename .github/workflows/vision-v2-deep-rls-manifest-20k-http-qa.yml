name: Vision V2 PG17 RLS Manifest 20K Full RPC HTTP100 300 NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/deep-integrity-qa/**'
      - '.github/workflows/vision-v2-deep-rls-manifest-20k-http-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deep-integrity:
    name: PG17 RLS all fixture tables AES manifest and 100-300 HTTP original full RPC
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Block production credentials and all other branches
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          echo "POSTGRES17_DISPOSABLE_ONLY=true NO_PRODUCTION=true NO_DEPLOY=true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned synthetic PG17 and AES dependencies
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Execute all RLS policies / encrypted publish failures / 20K full report HTTP concurrency
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/deep-integrity-qa/deep.py
          echo "QA_DEEP_INTEGRITY_PASS=true"
      - name: Audit NO-GO preservation
        if: always()
        run: echo "NO_SUPABASE=true NO_APKS=true NO_PANEL=true NO_SITE=true NO_TVS=true NO_REAL_HISTORY=true"
