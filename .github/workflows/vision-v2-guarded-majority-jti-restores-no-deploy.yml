name: Vision V2 PG17 Four Authority Out Of Restore Domain Guard JTI No Deploy
on:
  push:
    branches:
      - experiment/vision-v2-toctou-continuous-guard-qa-20261102
    paths:
      - 'tests/vision-v2-sequence-qa/guarded-majority-qa/verify.py'
      - 'tests/vision-v2-sequence-qa/quorum-jti-qa/worker.py'
      - '.github/workflows/vision-v2-guarded-majority-jti-restores-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  witness-adversarial:
    name: Three SQL PG17 voters plus independent PG17 JTI guard real rollback
    runs-on: ubuntu-latest
    timeout-minutes: 24
    services:
      postgres_main:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      postgres_witness:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_witness_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-witness-password
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_witness_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      postgres_shadow:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_witness_shadow_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-shadow-password
        ports: [5435:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_witness_shadow_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      postgres_anchor:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_anchor_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-anchor-password
        ports: [5436:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_anchor_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      postgres_guard:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_guard_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-guard-password
        ports: [5437:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_guard_disposable"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis_primary:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis_secondary:
        image: redis:7.4-alpine
        ports: [6380:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse official credentials and foreign branches
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-toctou-continuous-guard-qa-20261102
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
          test -z "${PGSERVICE:-}"
          test -z "${REDIS_URL:-}"
          echo 'NO_DEPLOY=1 QA_STREAM_GUARD_GROUP=1 DRAIN_DISABLED=1'
      - run: python -m pip install 'psycopg[binary,pool]==3.2.6' 'redis==5.2.1' 'websockets==14.2'
      - name: Ephemeral localhost TLS only
        run: |
          set -euo pipefail
          mkdir -p qa-restore-certs
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout qa-restore-certs/local.key -out qa-restore-certs/local.pem \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          chmod 600 qa-restore-certs/local.key
      - name: Syntax and separate PG17/Redis service checks
        run: |
          python -m py_compile tests/vision-v2-sequence-qa/quorum-jti-qa/controller.py
          python -m py_compile tests/vision-v2-sequence-qa/quorum-jti-qa/worker.py
          python -m py_compile tests/vision-v2-sequence-qa/guarded-majority-qa/verify.py
      - name: Real three voter + separate guard PG17 2/3 restore and full restore counterexample
        env:
          QA_STREAM_GUARD_GROUP: '1'
          QA_VOTER_WITNESS_CONTAINER: ${{ job.services.postgres_witness.id }}
          QA_VOTER_SHADOW_CONTAINER: ${{ job.services.postgres_shadow.id }}
          QA_VOTER_ANCHOR_CONTAINER: ${{ job.services.postgres_anchor.id }}
          QA_INDEPENDENT_GUARD_CONTAINER: ${{ job.services.postgres_guard.id }}
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/guarded-majority-qa/verify.py | tee qa-v2-guarded-majority.log
      - name: Require replay denial while guard independent and reproduce total-restore SECURITY FAIL
        run: |
          python - <<'PY'
          import json
          x=json.load(open('qa-v2-guarded-majority.json'))
          assert x['production_GO'] is False
          assert x['real_PG17_voter_containers']==3
          assert x['real_external_PG17_guard_containers']==1
          assert x['two_real_OS_workers']['one_ACK_one_DENY']
          assert x['2_of_3_real_pg_restore']['old_JTI_reaccepted'] is False
          assert x['3_of_3_voters_restored']['old_JTI_reaccepted'] is False
          assert x['real_guard_stop_restart']['offline']['result']=='DENY'
          assert x['real_guard_stop_restart']['recovered']['result']=='ACK'
          assert x['manual_pinned_leader_term']['old_leader_DENY']
          assert x['15_TV_signed_JTI_login_latency']['ACK']==15
          assert x['FULL_3_voters_PLUS_guard_real_pg_restore']['consumed_signed_JTI_reaccepted_after_full_rollback']
          assert x['security_verdict']=='FAIL_FULL_ROLLBACK_REPLAY_AND_UNPROVEN_SPLIT_BRAIN_CONSENSUS'
          print('4_PG_LOCAL_GUARD_PASS=1 FULL_RESTORE_SECURITY_FAIL=1 GO=0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg17-four-independent-guard-rollback-negative
          path: |
            qa-v2-guarded-majority.log
            qa-v2-guarded-majority.json
          retention-days: 14
