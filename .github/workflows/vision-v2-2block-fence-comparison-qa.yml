name: Vision V2 Experimental PG17 Two-Block A/B Revocation NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/secure-pool-qa/grouped_commit_revoke_qa.py'
      - '.github/workflows/vision-v2-2block-fence-comparison-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: PG17 pool ${{ matrix.pool }} chunk ${{ matrix.chunk }} group ${{ matrix.group }} rounds ${{ matrix.rounds }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pool: 8, chunk: 65536, group: 1, rounds: 1}
          - {pool: 8, chunk: 65536, group: 2, rounds: 1}
          - {pool: 8, chunk: 262144, group: 1, rounds: 1}
          - {pool: 8, chunk: 262144, group: 2, rounds: 1}
          - {pool: 12, chunk: 65536, group: 1, rounds: 1}
          - {pool: 12, chunk: 65536, group: 2, rounds: 1}
          - {pool: 12, chunk: 262144, group: 1, rounds: 1}
          - {pool: 12, chunk: 262144, group: 2, rounds: 3}
          - {pool: 20, chunk: 65536, group: 1, rounds: 1}
          - {pool: 20, chunk: 65536, group: 2, rounds: 1}
          - {pool: 20, chunk: 262144, group: 1, rounds: 1}
          - {pool: 20, chunk: 262144, group: 2, rounds: 1}
    runs-on: ubuntu-latest
    timeout-minutes: 29
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vision_v2_quarantine_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-only-local-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d vision_v2_quarantine_disposable"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deny production credentials and wrong branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${PGHOST:-}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6' 'cryptography==44.0.3'
      - name: Reuse full commercial and socket benchmark PG17 (no code changes)
        env:
          QA_POOL: ${{ matrix.pool }}
          QA_CHUNK: ${{ matrix.chunk }}
          QA_ROUNDS: ${{ matrix.rounds }}
          QA_STREAM_GUARD_GROUP: ${{ matrix.group }}
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/independent-adversarial-qa/adversarial_recheck.py | tee qa-comparison.log
      - name: Deterministic concurrent COMMIT and revoke
        if: ${{ matrix.group == 2 }}
        env:
          QA_COMMERCIAL_CHUNK: ${{ matrix.chunk }}
          QA_PG_POOL_SIZE: ${{ matrix.pool }}
          QA_COMMERCIAL_ADMISSIONS: ${{ matrix.pool }}
          QA_STREAM_GUARD_GROUP: '2'
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/vision-v2-sequence-qa/secure-pool-qa/grouped_commit_revoke_qa.py | tee qa-revoke.log
      - name: Preserve traces even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group-p${{ matrix.pool }}-c${{ matrix.chunk }}-g${{ matrix.group }}-r${{ matrix.rounds }}
          path: |
            qa-comparison.log
            qa-revoke.log
          if-no-files-found: warn
          retention-days: 14
