name: Vision iPhone WebKit isolated functional audit NO DEPLOY
on:
  push:
    branches:
      - experiment/vision-v2-sequence-watermark-qa-20261031
    paths:
      - 'tests/vision-v2-sequence-qa/iphone-webkit-qa/**'
      - '.github/workflows/vision-v2-iphone-webkit-isolated-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone-webkit:
    name: WebKit iPhone SE 13 13ProMax local only
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse production credentials
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/vision-v2-sequence-watermark-qa-20261031
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
      - name: Install matching WebKit client in official Playwright image
        run: npm install --no-save playwright@1.56.1
      - name: Serve QA-only copies without any live API
        shell: bash
        run: |
          set -euo pipefail
          node tests/vision-v2-sequence-qa/iphone-webkit-qa/server.cjs >qa-iphone-server.log 2>&1 &
          echo $! >qa-iphone-server.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat qa-iphone-server.log
          exit 1
      - name: Exercise real WebKit iPhone profiles, preserve product FAIL
        shell: bash
        run: |
          node tests/vision-v2-sequence-qa/iphone-webkit-qa/audit.cjs | tee qa-iphone-webkit.log
      - name: Save reports even on product failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-iphone-webkit-results
          path: |
            qa-iphone-webkit-results.json
            qa-iphone-webkit.log
            qa-iphone-server.log
          if-no-files-found: warn
          retention-days: 14
